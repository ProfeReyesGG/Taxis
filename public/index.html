  class InteractiveMap {
    constructor(host, options) {
      this.host = host;
      this.options = options;
      this.zoom = 15;
      this.center = options.pickup || options.destination || CENTER;
      this.gesture = null;
      this.resizeObserver = null;
      this.fit();
      this.host.innerHTML = '<div class="map-canvas" role="application" aria-label="Mapa del punto de recogida"></div><div class="map-zoom-control"><button data-map-zoom="in" aria-label="Acercar">+</button><button data-map-zoom="out" aria-label="Alejar">−</button></div>' + (options.interactive ? '<div class="map-selection-hint"><span class="hint-dot-green"></span>Toca el mapa para marcar dónde recogerte</div>' : '<div class="map-static-note">Solo punto de recogida · sin rastreo</div>') + '<a class="map-attribution" target="_blank" rel="noreferrer" href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a>';
      this.canvas = this.host.querySelector(".map-canvas");
      this.bind();
      if (typeof ResizeObserver !== "undefined") {
        this.resizeObserver = new ResizeObserver(() => this.draw());
        this.resizeObserver.observe(this.host);
      }
      this.draw();
    }

    world(point, zoom = this.zoom) {
      const scale = 256 * 2 ** zoom;
      const latitude = Math.max(-85.0511, Math.min(85.0511, point.lat));
      const sine = Math.sin(latitude * Math.PI / 180);
      return { x: (point.lng + 180) / 360 * scale, y: (.5 - Math.log((1 + sine) / (1 - sine)) / (4 * Math.PI)) * scale };
    }

    coordinate(point) {
      const scale = 256 * 2 ** this.zoom;
      const latitude = Math.PI - 2 * Math.PI * point.y / scale;
      return { lat: 180 / Math.PI * Math.atan(.5 * (Math.exp(latitude) - Math.exp(-latitude))), lng: point.x / scale * 360 - 180 };
    }

    fit() {
      const pickup = this.options.pickup;
      const destination = this.options.destination;
      if (!pickup || !destination) return;
      this.center = { lat: (pickup.lat + destination.lat) / 2, lng: (pickup.lng + destination.lng) / 2 };
      const difference = Math.max(Math.abs(pickup.lat - destination.lat), Math.abs(pickup.lng - destination.lng));
      this.zoom = difference > .08 ? 11 : difference > .035 ? 12 : difference > .014 ? 13 : difference > .006 ? 14 : 15;
    }

    bind() {
      this.canvas.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        this.canvas.setPointerCapture(event.pointerId);
        this.gesture = { x: event.clientX, y: event.clientY, center: { ...this.center }, moved: false };
      });
      this.canvas.addEventListener("pointermove", (event) => {
        if (!this.gesture) return;
        const dx = event.clientX - this.gesture.x;
        const dy = event.clientY - this.gesture.y;
        if (Math.abs(dx) + Math.abs(dy) > 7) this.gesture.moved = true;
        if (this.gesture.moved) {
          const origin = this.world(this.gesture.center);
          this.center = this.coordinate({ x: origin.x - dx, y: origin.y - dy });
          this.draw();
        }
      });
      this.canvas.addEventListener("pointerup", (event) => {
        const gesture = this.gesture;
        this.gesture = null;
        if (!gesture?.moved && this.options.interactive) {
          const box = this.host.getBoundingClientRect();
          const center = this.world(this.center);
          const location = this.coordinate({ x: center.x + event.clientX - box.left - box.width / 2, y: center.y + event.clientY - box.top - box.height / 2 });
          chooseMapPoint(location);
        }
      });
      this.canvas.addEventListener("pointercancel", () => { this.gesture = null; });
      this.host.querySelectorAll("[data-map-zoom]").forEach((button) => button.addEventListener("click", () => {
        this.zoom = Math.max(9, Math.min(18, this.zoom + (button.dataset.mapZoom === "in" ? 1 : -1)));
        this.draw();
      }));
    }

    draw() {
      if (!this.canvas || !this.host.isConnected) return;
      const width = this.host.clientWidth || 360;
      const height = this.host.clientHeight || 300;
      const center = this.world(this.center);
      const startX = Math.floor((center.x - width / 2) / 256);
      const endX = Math.floor((center.x + width / 2) / 256);
      const startY = Math.floor((center.y - height / 2) / 256);
      const endY = Math.floor((center.y + height / 2) / 256);
      const scale = 2 ** this.zoom;
      let tiles = "";

      for (let x = startX; x <= endX; x++) {
        for (let y = startY; y <= endY; y++) {
          if (y < 0 || y >= scale) continue;
          const tileX = ((x % scale) + scale) % scale;
          const left = x * 256 - center.x + width / 2;
          const top = y * 256 - center.y + height / 2;
          tiles += `<span class="map-tile" aria-hidden="true" style="left:${left}px;top:${top}px;background-image:url(https://tile.openstreetmap.org/${this.zoom}/${tileX}/${y}.png)"></span>`;
        }
      }

      const point = (coordinates) => {
        if (!coordinates) return null;
        const position = this.world(coordinates);
        return { x: position.x - center.x + width / 2, y: position.y - center.y + height / 2 };
      };
      const first = point(this.options.pickup);
      const second = point(this.options.destination);
      if (first && second) {
        tiles += `<svg class="route-overlay" aria-hidden="true" viewBox="0 0 ${width} ${height}"><path d="M ${first.x} ${first.y} C ${first.x + (second.x - first.x) * .33} ${first.y - 22}, ${second.x - (second.x - first.x) * .26} ${second.y + 22}, ${second.x} ${second.y}" fill="none" stroke="#134738" stroke-dasharray="8 7" stroke-linecap="round" stroke-width="3.5"></path></svg>`;
      }
      if (first) tiles += `<span class="map-pin map-pin-pickup" style="left:${first.x}px;top:${first.y}px"><span>A</span></span>`;
      if (second) tiles += `<span class="map-pin map-pin-destination" style="left:${second.x}px;top:${second.y}px"><span>B</span></span>`;
      this.canvas.innerHTML = tiles;
    }

    destroy() {
      if (this.resizeObserver) this.resizeObserver.disconnect();
      this.resizeObserver = null;
    }
  }

  function prepareMaps() {
    const host = app.querySelector(".map-host");
    if (!host) return;
    const kind = host.dataset.map;
    if (kind === "request") {
      state.map = new InteractiveMap(host, { pickup: state.draft.pickup, destination: null, interactive: true });
    } else if (kind === "ride") {
      const ride = state.data.rides.find((item) => item.id === host.dataset.id);
      if (ride && Number.isFinite(Number(ride.pickup_lat)) && Number.isFinite(Number(ride.pickup_lng))) {
        state.map = new InteractiveMap(host, { pickup: { lat: Number(ride.pickup_lat), lng: Number(ride.pickup_lng) }, destination: null });
      }
    } else {
      const ride = state.data.rides.find((item) => ACTIVE.includes(item.status));
      state.map = new InteractiveMap(host, { pickup: ride ? { lat: ride.pickup_lat, lng: ride.pickup_lng } : CENTER, destination: null });
    }
  }

  async function optimizePhoto(file) {
    if (!file || !file.size) return null;
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error("Las fotografías deben ser JPG, PNG o WebP.");
    let image = file;
    if (file.size > 620_000) {
      if (typeof createImageBitmap !== "function") throw new Error("La imagen es muy grande; usa una fotografía menor a 600 KB.");
      const bitmap = await createImageBitmap(file);
      const proportion = Math.min(1, 1200 / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(bitmap.width * proportion));
      canvas.height = Math.max(1, Math.round(bitmap.height * proportion));
      const context = canvas.getContext("2d", { alpha: false });
      if (!context) throw new Error("No fue posible optimizar la fotografía.");
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close();
      image = await new Promise((resolve, reject) => canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("No fue posible optimizar la fotografía.")), "image/jpeg", .78));
      if (image.size > 620_000) {
        image = await new Promise((resolve, reject) => canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("No fue posible comprimir la fotografía.")), "image/jpeg", .55));
      }
    }
    if (image.size > 650_000) throw new Error("La fotografía sigue siendo demasiado pesada; selecciona otra imagen.");
    const bytes = new Uint8Array(await image.arrayBuffer());
    let text = "";
    for (let start = 0; start < bytes.length; start += 8192) text += String.fromCharCode(...bytes.subarray(start, start + 8192));
    return { data: btoa(text), mime: image.type };
  }

  async function uploadDriverPhotos(form, values) {
    for (const [field, kind, destination] of [["driverPhoto", "driver", "driverPhotoKey"], ["vehiclePhoto", "vehicle", "vehiclePhotoKey"]]) {

  async function uploadPhotoFile(file, kind) {
    const optimized = await optimizePhoto(file);
    if (!optimized) throw new Error("Selecciona una fotografía válida.");
    const result = await fetch(API, {
      method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ action: "uploadPhoto", kind, ...optimized }),
    });
    const payload = await result.json();
    if (!result.ok) throw new Error(payload.error || "No se pudo subir la fotografía.");
    return payload;
  }

  function parseCsv(source) {
    const cleaned = String(source || "").replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
    const firstLine = cleaned.split("\n", 1)[0];
    const delimiters = [",", ";", "\t"];
    const delimiter = delimiters.sort((first, second) => firstLine.split(second).length - firstLine.split(first).length)[0];
    const records = [];
    let row = [], cell = "", quoted = false;
    for (let index = 0; index <= cleaned.length; index++) {
      const character = index === cleaned.length ? "\n" : cleaned[index];
      if (quoted && character === '"' && cleaned[index + 1] === '"') { cell += '"'; index++; continue; }
      if (character === '"') { quoted = !quoted; continue; }
      if (!quoted && (character === delimiter || character === "\n")) {
        row.push(cell.trim().normalize("NFC")); cell = "";
        if (character === "\n") { if (row.some(Boolean)) records.push(row); row = []; }
        continue;
      }
      cell += character;
    }
    if (quoted) throw new Error("El archivo CSV tiene comillas sin cerrar.");
    if (records.length < 2) throw new Error("El CSV debe contener encabezados y al menos un destino.");
    if (records.length > 1001) throw new Error("Puedes importar hasta 1,000 destinos por archivo.");
    const aliases = { municipio: "municipio", localidad: "municipio", ciudad: "municipio", town: "municipio", origen: "origen", zona: "origen", destino: "destino", tarifa: "tarifa", precio: "tarifa", servicio: "tarifa", recogida: "recogida", cargo_recogida: "recogida", eta_min: "eta_min", minutos: "eta_min", tiempo: "eta_min", latitud: "latitud", longitud: "longitud", llegada: "llegada", recomendado: "recomendado", modo: "modo", descuento_estudiante: "descuento_estudiante" };
    const headers = records.shift().map((header) => aliases[normalize(header).replace(/\s+/g, "_")] || normalize(header));
    for (const required of ["municipio", "destino", "tarifa"]) {
      if (!headers.includes(required)) throw new Error(`El CSV no incluye la columna obligatoria "${required}".`);
    }
    return records.map((record) => Object.fromEntries(headers.map((header, index) => [header, record[index] || ""])));
  }

  async function importCsvFile(file) {
    if (!file) return;
    try {
      let content;
      if (typeof file.arrayBuffer === "function" && typeof TextDecoder !== "undefined") {
        const bytes = new Uint8Array(await file.arrayBuffer());
        if (bytes.length > 1 && bytes[0] === 0xff && bytes[1] === 0xfe) {
          content = new TextDecoder("utf-16le").decode(bytes);
        } else if (bytes.length > 1 && bytes[0] === 0xfe && bytes[1] === 0xff) {
          content = new TextDecoder("utf-16be").decode(bytes);
        } else {
          try { content = new TextDecoder("utf-8", { fatal: true }).decode(bytes); }
          catch { content = new TextDecoder("windows-1252").decode(bytes); }
        }
      } else content = await file.text();
      const rows = parseCsv(content);
      const result = await request("importTariffs", { rows }, { message: "Las tarifas por destino se importaron correctamente." });
      if (result) toast(`${result.created} tarifas nuevas y ${result.updated} actualizadas.`);
    } catch (error) {
      toast(error.message || "No fue posible procesar el archivo CSV.", true);
    }
  }

  async function submitForm(form) {
    const values = Object.fromEntries([...new FormData(form)].filter(([, item]) => typeof item === "string"));
    switch (form.dataset.form) {
      case "login": {
        const result = await request("login", values, { message: "Inicio de sesión correcto." });
        if (result?.account && state.gate === "driver" && result.account.role !== "driver") toast("Iniciaste con una cuenta que no está registrada como taxista.", true);
        break;
      }
      case "register": {
        try {
          const profileFile = form.querySelector('input[name="profilePhoto"]')?.files?.[0];
          if (!profileFile) throw new Error("Tu fotografía de perfil es obligatoria.");
          const profilePhoto = await optimizePhoto(profileFile);
          await request("registerPassenger", { ...values, profilePhoto, seniorEligible: Boolean(form.elements.seniorEligible?.checked),
            privacyAccepted: Boolean(form.elements.privacyAccepted?.checked), termsAccepted: Boolean(form.elements.termsAccepted?.checked),
          }, { message: "Tu cuenta y fotografía de pasajero están listas." });
        } catch (error) { toast(error.message || "No fue posible preparar tu fotografía.", true); }
        break;
      }
      case "organization": await request("createOrganization", values, { closeModal: true, message: `${values.kind === "union" ? "Sindicato" : "Grupo"} registrado correctamente.` }); break;
      case "site": {
        try {
          const file = form.querySelector('input[name="sitePhoto"]')?.files?.[0];
          if (!file) throw new Error("La fotografía del sitio es obligatoria.");
          values.sitePhotoKey = (await uploadPhotoFile(file, "site")).key;
          await request("createSite", values, { closeModal: true, message: "Sitio, fotografía y cuenta autorizados correctamente." });
        } catch (error) { toast(error.message || "No fue posible subir la foto del sitio.", true); }
        break;
      }
      case "reset-site": await request("resetSitePassword", values, { closeModal: true, message: "Se actualizó la contraseña del sitio." }); break;
      case "site-settings": await request("updateSiteSettings", values, { message: "Se actualizó el tiempo de llegada y contacto del sitio." }); break;
      case "site-admin": {
        try {
          const file = form.querySelector('input[name="sitePhoto"]')?.files?.[0];
          if (file) values.sitePhotoKey = (await uploadPhotoFile(file, "site")).key;
          await request("updateSiteSettings", values, { closeModal: true, message: "Se actualizaron horario, ubicación y fotografía del sitio." });
        } catch (error) { toast(error.message || "No fue posible actualizar el sitio.", true); }
        break;
      }
      case "tariff": await request("saveTariff", values, { closeModal: true, message: "La tarifa por destino se guardó correctamente." }); break;
      case "driver":
      case "driver-documents": {
        try {
          const prepared = await uploadDriverPhotos(form, values);
          if (form.dataset.form === "driver") prepared.driverConsent = Boolean(form.elements.driverConsent?.checked);
          await request(form.dataset.form === "driver" ? "createDriver" : "updateDriverDocuments", prepared, {
            closeModal: true, message: form.dataset.form === "driver" ? "Taxista, fotografías y unidad autorizados." : "Fotos y documentos actualizados.",
          });
        } catch (error) {
          toast(error.message || "No fue posible preparar las fotografías.", true);
        }
        break;
      }
      case "reset-password": await request("resetDriverPassword", values, { closeModal: true, message: "La contraseña del taxista se actualizó." }); break;
      case "ride-eta": await request("updateRideEta", values, { closeModal: true, message: "Se notificó el nuevo tiempo estimado al pasajero." }); break;
      case "driver-schedule": await request("updateDriverSchedule", values, { message: "Se actualizó tu horario personal." }); break;
      case "report": await request("createReport", values, { closeModal: true, message: "El sitio y la administración recibieron tu reporte privado." }); break;
      case "resolve-report": await request("resolveReport", values, { closeModal: true, message: "La medida de seguimiento quedó registrada." }); break;
      case "change-password": await request("changePassword", values, { closeModal: true, message: "Tu contraseña se actualizó." }); break;
      case "profile": {
        try {
          if (state.data.account.role === "passenger") {
            values.seniorEligible = Boolean(form.elements.seniorEligible?.checked);
            const file = form.querySelector('input[name="profilePhoto"]')?.files?.[0];
            if (file) values.profilePhotoKey = (await uploadPhotoFile(file, "passenger")).key;
          }
          if (state.data.account.role === "driver") {
            const portrait = form.querySelector('input[name="driverPhoto"]')?.files?.[0];
            const vehicle = form.querySelector('input[name="vehiclePhoto"]')?.files?.[0];
            if (portrait) values.driverPhotoKey = (await uploadPhotoFile(portrait, "driver")).key;
            if (vehicle) values.vehiclePhotoKey = (await uploadPhotoFile(vehicle, "vehicle")).key;
          }
          if (state.data.account.role === "site") {
            const file = form.querySelector('input[name="sitePhoto"]')?.files?.[0];
            if (file) values.sitePhotoKey = (await uploadPhotoFile(file, "site")).key;
          }
          await request("saveProfile", values, { message: "Tu perfil y fotografía se actualizaron." });
        } catch (error) { toast(error.message || "No fue posible actualizar tu perfil.", true); }
        break;
      }
      case "settings": await request("saveSettings", {
        ...values,
        serviceEnabled: form.elements.serviceEnabled.checked,
        pilotMode: form.elements.pilotMode.checked,
        insuranceRequired: form.elements.insuranceRequired.checked,
        legalReviewConfirmed: form.elements.legalReviewConfirmed.checked,
        transportAuthorizationConfirmed: form.elements.transportAuthorizationConfirmed.checked,
        discountsAuthorized: form.elements.discountsAuthorized.checked,
        childFareAuthorized: form.elements.childFareAuthorized.checked,
        allowDriverClaim: form.elements.allowDriverClaim.checked,
      }, { message: "Se actualizó la configuración maestra." }); break;
      default: break;
    }
  }

  function buttonAction(button, event) {
    const action = button.dataset.action;
    if (!action) return;

    if (action === "choose-gate") { state.gate = button.dataset.value; render(); return; }
    if (action === "auth-register") { state.authMode = "register"; state.gate = "passenger"; render(); return; }
    if (action === "auth-login") { state.authMode = "login"; render(); return; }
    if (action === "navigate") { state.page = button.dataset.page; state.sidebar = false; state.rideFilter = "all"; render(); return; }
    if (action === "open-sidebar") { state.sidebar = true; render(); return; }
    if (action === "close-sidebar") { state.sidebar = false; render(); return; }
    if (action === "close-toast") { notifications.innerHTML = ""; return; }
    if (action === "logout") { void request("logout"); return; }
    if (action === "close-modal") { closeModal(); return; }
    if (action === "modal-backdrop" && event.target === button) { closeModal(); return; }
    if (action === "open-union-modal") { organizationModal("union"); return; }
    if (action === "open-group-modal") { organizationModal("group"); return; }
    if (action === "open-site-modal") { siteModal(); return; }
    if (action === "open-reset-site") { resetSiteModal(button.dataset.id); return; }
    if (action === "open-edit-site") { editSiteModal(button.dataset.id); return; }
    if (action === "open-tariff-modal") { tariffModal(); return; }
    if (action === "open-edit-tariff") { tariffModal(button.dataset.id); return; }
    if (action === "open-driver-modal") { driverModal(); return; }
    if (action === "open-driver-documents") { driverDocumentsModal(button.dataset.id); return; }
    if (action === "open-reset-password") { resetPasswordModal(button.dataset.id); return; }
    if (action === "open-eta-modal") { etaModal(button.dataset.id); return; }
    if (action === "open-change-password") { changePasswordModal(); return; }
    if (action === "open-report-modal") { reportModal(button.dataset.id || ""); return; }
    if (action === "open-resolve-report") { resolveReportModal(button.dataset.id); return; }
    if (action === "import-csv") { app.querySelector("#tariff-csv")?.click(); return; }
    if (action === "accept-legal") {
      void request("acceptLegal", { privacyAccepted: true, termsAccepted: true }, { message: "Tu aceptación de privacidad y condiciones quedó registrada." });
      return;
    }

    if (action === "choose-color") {
      const color = button.dataset.value;
      if (!COLORS.includes(color)) return;
      dialogs.querySelector('[name="color"]').value = color;
      dialogs.querySelectorAll(".color-options button").forEach((item) => item.classList.toggle("color-active", item.dataset.value === color));
      return;
    }

    if (action === "toggle-organization") { void request("toggleOrganization", { id: button.dataset.id }, { message: "Se actualizó la organización." }); return; }
    if (action === "toggle-site") { void request("toggleSite", { id: button.dataset.id }, { message: "Se actualizó el estado del sitio." }); return; }
    if (action === "toggle-driver") { void request("toggleDriver", { id: button.dataset.id }, { message: "Se actualizó el estado del taxista." }); return; }
    if (action === "toggle-tariff") { void request("toggleTariff", { id: button.dataset.id }, { message: "Se actualizó la disponibilidad del destino." }); return; }
    if (action === "purge-history") {
      if (window.confirm(`Se eliminarán los servicios concluidos y registros anteriores a ${state.data.settings.data_retention_days} días. Los viajes activos y evidencias con resguardo legal se conservan. ¿Deseas continuar?`)) {
        void request("purgeExpiredData", {}, { message: "Se depuraron los datos personales fuera del plazo de conservación." });
      }
      return;
    }
    if (action === "ride-filter") { state.rideFilter = button.dataset.value; render(); return; }
    if (action === "select-pickup") { if (event.target.closest("input,button")) return; state.draft.selecting = "pickup"; render(); return; }
    if (action === "select-destination") { if (event.target.closest("input,button")) return; state.draft.selecting = "destination"; render(); return; }

    if (action === "locate-me") {
      event.stopPropagation();
      if (!navigator.geolocation) return toast("Este dispositivo no admite geolocalización.", true);
      navigator.geolocation.getCurrentPosition((position) => {
        state.draft.pickup = { lat: position.coords.latitude, lng: position.coords.longitude, label: "Mi ubicación actual" };
        const located = state.data.sites.filter((site) => Number.isFinite(Number(site.base_lat)) && Number.isFinite(Number(site.base_lng)) && site.base_lat !== null && site.base_lng !== null)
          .map((site) => ({ site, distance: (Number(site.base_lat) - position.coords.latitude) ** 2 + (Number(site.base_lng) - position.coords.longitude) ** 2 }))
          .sort((first, second) => first.distance - second.distance)[0];
        if (located && located.site.id !== state.draft.siteId) {
          state.draft.siteId = located.site.id;
          state.draft.tariffId = "";
          state.draft.destination = null;
          state.draft.specialDestination = "";
        }
        state.draft.selecting = "pickup";
        render();
      }, () => toast("No fue posible obtener tu ubicación. Revisa los permisos del navegador.", true), { enableHighAccuracy: true, timeout: 12000 });
      return;
    }

    if (action === "choose-place") {
      const place = PLACES[Number(button.dataset.value)];
      if (!place) return;
      state.draft.pickup = { ...place };
      render();
      return;
    }

    if (action === "passengers-minus") { state.draft.passengers = Math.max(1, state.draft.passengers - 1); state.draft.seniors = Math.min(state.draft.passengers, state.draft.seniors); state.draft.students = Math.min(state.draft.passengers, state.draft.students); render(); return; }
    if (action === "passengers-plus") { state.draft.passengers = Math.min(passengerCapacity() - state.draft.children, state.draft.passengers + 1); render(); return; }
    if (action === "children-minus") { state.draft.children = Math.max(0, state.draft.children - 1); if (!state.draft.children) state.draft.childSafetyAccepted = false; render(); return; }
    if (action === "children-plus") { state.draft.children = Math.min(passengerCapacity() - state.draft.passengers, state.draft.children + 1); render(); return; }
    if (action === "quick-destination") {
      const tariff = siteTariffs().find((item) => item.id === button.dataset.id);
      if (tariff) { state.draft.tariffId = tariff.id; state.draft.specialDestination = ""; state.draft.shareRideId = ""; state.draft.destination = { label: tariff.destination, lat: tariff.destination_lat, lng: tariff.destination_lng }; render(); }
      return;
    }

    if (action === "choose-shared") {
      const shared = state.data.shared_opportunities?.find((item) => item.ride_id === button.dataset.id);
      if (!shared) return toast("Esta unidad compartida ya no está disponible.", true);
      state.draft.shareRideId = shared.ride_id;
      state.draft.scheduleMode = "now";
      state.draft.scheduledAt = "";
      state.draft.passengers = Math.min(state.draft.passengers, shared.available_seats);
      state.draft.children = Math.min(state.draft.children, Math.max(0, shared.available_seats - state.draft.passengers));
      if (!state.draft.children) state.draft.childSafetyAccepted = false;
      render();
      return;
    }
    if (action === "clear-shared") { state.draft.shareRideId = ""; render(); return; }
    if (action === "select-active-ride") { state.selectedActiveRide = button.dataset.id; render(); return; }

    if (action === "request-ride") {
      const { siteId, tariffId, safetyAccepted, specialDestination } = state.draft;
      if (!siteId || (!tariffId && specialDestination.trim().length < 3)) return toast("Selecciona un destino recomendado o escribe una salida especial.", true);
      if (!safetyAccepted) return toast("Confirma primero las medidas de seguridad.", true);
      return rideConfirmationModal();
    }

    if (action === "confirm-ride-request") {
      const { pickup, siteId, tariffId, passengers, notes, safetyAccepted, children, childSafetyAccepted, specialDestination,
        pickupPhotoKey, seniors, students, shareRideId, scheduleMode, scheduledAt } = state.draft;
      if (passengers + children > passengerCapacity()) return toast("La unidad ya no tiene suficientes lugares disponibles.", true);
      void request("createRide", {
        siteId, tariffId, pickupLabel: pickup.label, pickupLat: pickup.lat, pickupLng: pickup.lng,
        paymentMethod: "cash", passengers, adultPassengers: passengers, childPassengers: children,
        childSafetyAccepted, seniorPassengers: Math.min(passengers, seniors + (state.data.account.senior_discount_eligible ? 1 : 0)),
        studentPassengers: students, specialDestination, pickupPhotoKey, notes, safetyAccepted, shareRideId,
        scheduledAt: scheduleMode === "scheduled" && scheduledAt ? new Date(scheduledAt).toISOString() : "",
      }, { closeModal: true, message: scheduleMode === "scheduled" ? "Tu solicitud programada se envió al sitio de taxis." : "Tu solicitud se envió directamente al sitio de taxis." });
      return;
    }

    if (action === "toggle-driver-status") {
      const driver = state.data.drivers.find((item) => item.id === button.dataset.id);
      if (!driver) return;
      const status = driver.status === "available" ? "offline" : "available";
      void request("setDriverStatus", { driverId: driver.id, status }, { message: status === "available" ? "La unidad ya puede recibir viajes." : "La unidad se desconectó." });
      return;
    }

    if (action === "assign-ride") {
      const container = button.closest(".manual-assignment");
      const select = container?.querySelector("select");
      const eta = container?.querySelector("[data-eta]");
      if (select) void request("acceptRide", { rideId: button.dataset.id, driverId: select.value, etaMinutes: Number(eta?.value || state.data.settings.default_eta_minutes) }, { message: "La unidad y el tiempo estimado se informaron al pasajero." });
      return;
    }
    if (action === "claim-ride" || action === "claim-passing") {
      const eta = app.querySelector(`[data-claim-eta="${button.dataset.id}"]`)?.value;
      void request("acceptRide", { rideId: button.dataset.id, etaMinutes: Number(eta || 12), passingBy: action === "claim-passing" }, { message: action === "claim-passing" ? "Tomaste el servicio porque vas de paso; tu sitio recibió aviso." : "La solicitud fue asignada a tu unidad y notificada al sitio." });
      return;
    }
    if (action === "confirm-special") {
      const input = app.querySelector(`[data-special-price="${button.dataset.id}"]`);
      void request("confirmSpecialFare", { rideId: button.dataset.id, perPerson: Number(input?.value || 0) }, { message: "La tarifa autorizada de la salida especial quedó confirmada." });
      return;
    }
    if (action === "update-ride-location") {
      if (!navigator.geolocation) return toast("Este dispositivo no admite geolocalización.", true);
      navigator.geolocation.getCurrentPosition((position) => {
        void request("updateRideLocation", { rideId: button.dataset.id, pickupLat: position.coords.latitude,
          pickupLng: position.coords.longitude, pickupLabel: "Ubicación actualizada manualmente" },
        { message: "Tu posición se actualizó una sola vez; no se activó seguimiento continuo." });
      }, () => toast("No fue posible obtener tu posición. Revisa los permisos del navegador.", true),
      { enableHighAccuracy: true, timeout: 12000 });
      return;
    }
    if (action === "share-google-maps" || action === "share-whatsapp" || action === "share-ride") {
      const ride = state.data.rides.find((item) => item.id === button.dataset.id);
      if (!ride) return;
      const location = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${ride.pickup_lat},${ride.pickup_lng}`)}`;
      const text = `Mi servicio de Taxi Turicato: ${ride.site_name || "sitio autorizado"}, taxi ${ride.driver_unit || "por asignar"}, placas ${ride.driver_plate || "pendientes"}, destino ${ride.destination_label}. Punto de recogida: ${location}`;
      if (action === "share-google-maps") window.open(location, "_blank", "noopener,noreferrer");
      else if (action === "share-whatsapp") window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank", "noopener,noreferrer");
      else if (navigator.share) void navigator.share({ title: "Mi servicio de Taxi Turicato", text, url: location }).catch(() => {});
      else window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank", "noopener,noreferrer");
      return;
    }
    if (action === "advance-ride") {
      const code = app.querySelector("#ride-security-code")?.value || "";
      void request("advanceRide", { rideId: button.dataset.id, securityCode: code }, { message: "Se actualizó el estado del servicio." });
      return;
    }
    if (action === "cancel-ride") {
      if (window.confirm("¿Deseas cancelar este servicio?")) void request("cancelRide", { rideId: button.dataset.id }, { message: "El viaje se canceló." });
      return;
    }
    if (action === "rate-ride") { void request("rateRide", { rideId: button.dataset.id, rating: Number(button.dataset.value) }, { message: "Gracias por calificar tu viaje." }); }
  }

  document.addEventListener("click", (event) => {
    const trigger = event.target.closest("[data-action]");
    if (trigger) buttonAction(trigger, event);
  });

  document.addEventListener("submit", (event) => {
    const form = event.target.closest("[data-form]");
    if (!form) return;
    event.preventDefault();
    void submitForm(form);
  });

  document.addEventListener("input", (event) => {
    const input = event.target;
    if (input.dataset.input === "pickup-label") state.draft.pickup.label = input.value;
    if (input.dataset.input === "ride-notes") state.draft.notes = input.value;
    if (input.dataset.input === "driver-search") state.driverSearch = input.value;
    if (input.dataset.input === "tariff-search") state.tariffSearch = input.value;
    if (input.dataset.input === "special-destination") {
      state.draft.specialDestination = input.value;
      if (input.value.trim()) { state.draft.tariffId = ""; state.draft.shareRideId = ""; }
    }
  });

  document.addEventListener("change", (event) => {
    const select = event.target;
    if (select.dataset.input === "driver-search") { render(); return; }
    if (select.dataset.input === "tariff-search") { render(); return; }
    if (select.id === "tariff-csv") { void importCsvFile(select.files?.[0]); select.value = ""; return; }
    if (select.dataset.change === "union-filter") { state.unionFilter = select.value; render(); return; }
    if (select.dataset.change === "town-filter") { state.townFilter = select.value; render(); return; }
    if (select.dataset.change === "preview-driver") { state.selectedDriver = select.value; render(); return; }
    if (select.dataset.change === "passenger-site") {
      state.draft.siteId = select.value;
      state.draft.tariffId = "";
      state.draft.destination = null;
      state.draft.specialDestination = "";
      state.draft.shareRideId = "";
      render();
      return;
    }
    if (select.dataset.change === "passenger-tariff") {
      const tariff = siteTariffs().find((item) => item.id === select.value);
      state.draft.tariffId = tariff?.id || "";
      state.draft.specialDestination = "";
      state.draft.shareRideId = "";
      state.draft.destination = tariff ? { label: tariff.destination, lat: tariff.destination_lat, lng: tariff.destination_lng } : null;
      render();
      return;
    }
    if (select.dataset.change === "schedule-mode") {
      state.draft.scheduleMode = select.value === "scheduled" ? "scheduled" : "now";
      if (state.draft.scheduleMode === "scheduled") state.draft.shareRideId = "";
      else state.draft.scheduledAt = "";
      render();
      return;
    }
    if (select.dataset.change === "scheduled-at") { state.draft.scheduledAt = select.value; render(); return; }
    if (select.dataset.change === "safety-consent") { state.draft.safetyAccepted = select.checked; render(); return; }
    if (select.dataset.change === "child-safety") { state.draft.childSafetyAccepted = select.checked; render(); return; }
    if (select.dataset.change === "senior-count") { state.draft.seniors = Math.max(0, Number(select.value)); render(); return; }
    if (select.dataset.change === "student-count") { state.draft.students = Math.max(0, Number(select.value)); render(); return; }
    if (select.dataset.input === "special-destination") { state.draft.specialDestination = select.value; render(); return; }
    if (select.dataset.change === "pickup-photo") {
      const file = select.files?.[0];
      if (file) void uploadPhotoFile(file, "pickup").then((result) => {
        state.draft.pickupPhotoKey = result.key;
        state.draft.pickupPhotoName = file.name;
        toast("La fotografía de tu punto de recogida quedó protegida.");
        render();
      }).catch((error) => toast(error.message || "No fue posible subir la fotografía.", true));
      return;
    }
    if (select.dataset.change === "modal-union") {
      const options = state.data.groups.filter((group) => group.active && group.parent_id === select.value);
      dialogs.querySelector("#driver-group-select").innerHTML = '<option value="">Sin grupo asignado</option>' + options.map((group) => `<option value="${esc(group.id)}">${esc(group.name)}</option>`).join("");
      const sitesList = state.data.sites.filter((site) => site.active && (!site.union_id || site.union_id === select.value));
      const selector = dialogs.querySelector("#driver-site-select");
      if (selector) selector.innerHTML = sitesList.map((site) => `<option value="${esc(site.id)}">${esc(site.name)} · ${esc(site.town)}</option>`).join("");
    }
  });

  document.addEventListener("focusin", (event) => {
    if (event.target.dataset.input === "pickup-label") state.draft.selecting = "pickup";
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && state.modal) closeModal();
  });

  setInterval(() => {
    if (!state.data || state.modal || state.pending || document.hidden) return;
    const focused = document.activeElement;
    if (focused && /INPUT|TEXTAREA|SELECT/.test(focused.tagName)) return;
    void refresh(true);
  }, 12000);

  void refresh();
})();

    </script>
  </body>
</html>
