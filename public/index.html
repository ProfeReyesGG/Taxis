    const note = register ? '¿Ya tienes cuenta? <button class="inline-link" data-action="auth-login">Inicia sesión</button>' : selected === "passenger" ? '¿Primera vez? <button class="inline-link" data-action="auth-register">Crea tu cuenta de pasajero</button>' : selected === "site" ? "La administración maestra crea el correo y contraseña de cada sitio." : selected === "driver" ? "Tu cuenta debe ser autorizada por la administración maestra." : "Acceso exclusivo de la persona administradora general.";
    app.innerHTML = `<main class="welcome-shell"><header class="welcome-topbar">${brand()}<span class="verified-pill"><span></span> Sitios autorizados</span></header><section class="welcome-grid"><div class="welcome-copy"><span class="eyebrow">MOVILIDAD LOCAL · TURICATO Y PURUARÁN</span><h1>Tu taxi de confianza, <em>sin vueltas.</em></h1><p>Tu sitio asigna una unidad concesionada y asegurada. Ves al conductor, el vehículo, las placas y la tarifa antes del viaje.</p><div class="feature-row"><span>✓ Sitios verificados</span><span>✓ Tarifa por destino</span><span>✓ Sin rastreo continuo</span></div>${safetyCard(1)}</div><div class="access-card access-card-netlify"><div class="access-heading"><span>${register ? "NUEVA CUENTA" : "BIENVENIDO"}</span><h2>${register ? "Regístrate como pasajero" : "Ingresa a Taxi Turicato"}</h2></div>${state.setupError ? `<div class="setup-alert">${icon("settings", 17)}<div><strong>Falta completar la configuración</strong><p>${esc(state.setupError)}</p><small>Consulta las instrucciones incluidas en el paquete.</small></div></div>` : ""}${register ? "" : `<div class="gate-list gate-list-compact">${choices}</div>`}<form class="access-form" data-form="${register ? "register" : "login"}">${register ? `<label class="form-field"><span>Nombre completo</span><input name="name" required placeholder="Nombre y apellidos" autocomplete="name"></label><label class="form-field"><span>Número de teléfono</span><input name="phone" required placeholder="10 dígitos" inputmode="tel" autocomplete="tel"></label>` : ""}<label class="form-field"><span>Correo electrónico</span><input name="email" required type="email" placeholder="tu@correo.com" autocomplete="${register ? "email" : "username"}"></label><label class="form-field"><span>Contraseña</span><input name="password" required type="password" minlength="8" placeholder="Mínimo 8 caracteres" autocomplete="${register ? "new-password" : "current-password"}"></label>${privacyConsent}<button class="primary-button access-button" type="submit"><span>${register ? "Crear mi cuenta" : "Iniciar sesión"}</span>${icon("arrow")}</button></form><p class="access-note">${note}</p></div></section>${legalFooter(true)}</main>`;
  }

  function renderShell() {
    const data = state.data;
    const links = navItems();
    const role = data.account.role === "admin" ? "Administración maestra" : data.account.role === "site" ? data.ownSite?.name || "Sitio autorizado" : data.account.role === "driver" ? "Taxista autorizado" : "Pasajero";
    const mobileLinks = data.account.role === "admin" ? links.filter((link) => ["overview", "sites", "drivers", "tariffs", "rides"].includes(link.id)) :
      data.account.role === "site" ? links.filter((link) => ["site-dashboard", "site-rides", "site-drivers", "site-history", "profile"].includes(link.id)) : links;
    const sidebar = `<aside class="app-sidebar ${state.sidebar ? "sidebar-open" : ""}"><div class="sidebar-top">${brand()}<button class="sidebar-close" data-action="close-sidebar" aria-label="Cerrar menú">${icon("x")}</button></div><div class="sidebar-role"><span>${esc(role.toUpperCase())}</span>${data.account.role === "admin" ? "<small>ACCESO MAESTRO TOTAL</small>" : data.account.role === "site" ? `<small>SOLO ${esc((data.ownSite?.town || "").toUpperCase())}</small>` : ""}</div><nav class="sidebar-nav">${links.map((link, index) => `${data.account.role === "admin" && index === 8 ? '<span class="sidebar-separator">VISTAS OPERATIVAS</span>' : ""}<button class="nav-link ${state.page === link.id ? "nav-active" : ""}" data-action="navigate" data-page="${esc(link.id)}">${icon(link.icon)}<span>${esc(link.label)}</span>${link.badge ? `<span class="nav-badge">${link.badge}</span>` : ""}</button>`).join("")}</nav><div class="sidebar-support"><span>${icon("shield", 16)} SERVICIO VERIFICADO</span><p>Viaja tranquilo.<br>Llega seguro.</p>${data.settings.support_phone ? `<a href="tel:${esc(String(data.settings.support_phone).replace(/[^\d+]/g, ""))}">${icon("phone", 15)} Soporte local</a>` : ""}</div><button class="sidebar-logout logout-button" data-action="logout">${icon("logout")}<span>Cerrar sesión</span></button></aside>`;
    const header = `<header class="app-header"><button class="mobile-menu-button" data-action="open-sidebar" aria-label="Abrir menú">${icon("menu")}</button><span class="header-location">${icon("pin", 17)}${esc(data.settings.service_area)}</span><div class="header-actions"><span class="service-badge ${data.settings.service_enabled ? "" : "service-paused"}"><span></span>${data.settings.service_enabled ? "Servicio activo" : "Servicio pausado"}</span><button class="header-user" data-action="navigate" data-page="profile">${avatar(data.account.name, true)}<span>${esc(data.account.name.split(" ")[0])}</span></button></div></header>`;
    const short = { overview: "Inicio", sites: "Sitios", drivers: "Taxis", tariffs: "Tarifas", rides: "Viajes", "site-dashboard": "Inicio", "site-rides": "Servicios", "site-drivers": "Taxis", "site-history": "Historial", profile: "Perfil", organizations: "Grupos" };
    const bottom = `<nav class="mobile-bottom-nav">${mobileLinks.map((link) => `<button class="${state.page === link.id ? "bottom-active" : ""}" data-action="navigate" data-page="${esc(link.id)}"><span>${icon(link.icon, 20)}${link.badge ? "<i></i>" : ""}</span><small>${esc(short[link.id] || link.label)}</small></button>`).join("")}</nav>`;
    app.innerHTML = `<main class="app-shell">${sidebar}${state.sidebar ? '<button class="sidebar-overlay" data-action="close-sidebar" aria-label="Cerrar menú"></button>' : ""}<section class="app-main">${header}<div class="app-content">${legalAcceptanceCard()}${content()}${legalFooter()}</div></section>${bottom}</main>`;
    prepareMaps();
  }

  function render() {
    if (state.map) { state.map.destroy(); state.map = null; }
    if (!state.data) renderAuth();
    else renderShell();
  }

  function content() {
    switch (state.page) {
      case "overview": return overview();
      case "sites": return sites();
      case "organizations": return organizations();
      case "drivers": return drivers();
      case "tariffs": return tariffs();
      case "rides": return rides(true);
      case "route-history": return routeHistory();
      case "reports": return reports();
      case "settings": return settings();
      case "site-dashboard": return siteDashboard();
      case "site-rides": return rides(true);
      case "site-drivers": return siteDrivers();
      case "site-history": return rides(false);
      case "site-passengers": return sitePassengers();
      case "site-tariffs": return tariffs(true);
      case "site-settings": return siteSettings();
      case "passenger-preview":
      case "request": return passenger();
      case "driver-preview": return driverPanel(true);
      case "driver-dashboard": return driverPanel(false);
      case "history": return rides(false);
      case "profile": return profile();
      default: return state.data.account.role === "admin" ? overview() : state.data.account.role === "site" ? siteDashboard() : passenger();
    }
  }

  function overview() {
    const data = state.data;
    const available = data.drivers.filter((driver) => driver.active && driver.status === "available");
    const active = data.rides.filter((ride) => ACTIVE.includes(ride.status));
    const today = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Mexico_City" }).format(new Date());
    const completed = data.rides.filter((ride) => ride.status === "completed" && new Intl.DateTimeFormat("en-CA", { timeZone: "America/Mexico_City" }).format(new Date(ride.completed_at)) === today);
    const income = completed.reduce((sum, ride) => sum + (ride.final_fare || ride.estimated_fare), 0);
    const metrics = [
      { icon: "car", label: "UNIDADES ACTIVAS", value: `${available.length}<small> / ${data.drivers.filter((driver) => driver.active).length}</small>`, note: "Disponibles para viajes" },
      { icon: "route", label: "VIAJES EN CURSO", value: String(active.length), note: "Solicitados o atendidos" },
      { icon: "building", label: "SITIOS AUTORIZADOS", value: String(data.sites.filter((site) => site.active).length), note: `${data.unions.length} sindicatos · ${data.tariffs.length} tarifas` },
      { icon: "chart", label: "SERVICIOS DE HOY", value: money(income), note: `${completed.length} viajes terminados`, highlight: true },
    ];
    const steps = [
      { done: data.unions.length > 0, label: "Registra tu primer sindicato", page: "organizations" },
      { done: data.sites.length > 0, label: "Crea un sitio y su cuenta de acceso", page: "sites" },
      { done: data.tariffs.length > 0, label: "Carga las tarifas por destino", page: "tariffs" },
      { done: data.drivers.length > 0, label: "Autoriza una unidad con póliza vigente", page: "drivers" },
      { done: data.legal.legal_ready, label: "Completa la revisión jurídica y de transporte", page: "settings" },
    ];
    const setup = steps.some((step) => !step.done) ? `<div class="setup-guide"><div><span>PUESTA EN MARCHA</span><h2>Deja lista tu central de taxis</h2></div><div>${steps.map((step, index) => `<button class="${step.done ? "setup-step-done" : ""}" data-action="navigate" data-page="${step.page}"><span>${step.done ? "✓" : index + 1}</span>${esc(step.label)}${icon("chevron", 16)}</button>`).join("")}</div></div>` : "";
    const activity = data.activity.length ? `<div class="activity-list">${data.activity.slice(0, 8).map((item) => `<article class="activity-item"><span class="activity-bullet activity-${esc(item.action.split("_")[0])}"></span><div><p>${esc(item.description)}</p><small>${esc(when(item.created_at))}</small></div></article>`).join("")}</div>` : empty("clock", "Todavía no hay actividad", "Aquí aparecerán los movimientos de la central.");
    const compliance = data.legal.legal_ready ? `<div class="compliance-banner compliance-ok">${icon("shield", 18)}<span>Expediente legal configurado. Verifica periódicamente autorizaciones, seguros y obligaciones de privacidad.</span></div>` : `<div class="compliance-banner compliance-warning">${icon("shield", 19)}<span><strong>Piloto interno:</strong> antes de operar públicamente completa responsable, domicilio, contacto ARCO, revisión jurídica y consulta al Instituto del Transporte.</span><button data-action="navigate" data-page="settings">Revisar</button></div>`;
    return `<section class="content-section admin-overview">${section("PANEL MAESTRO DE ADMINISTRACIÓN", "Así va tu central hoy", "Control total sobre Turicato, Puruarán, sitios, tarifas, unidades y auditoría.", `<button class="primary-button top-action" data-action="open-driver-modal">${icon("plus")}<span>Registrar taxista</span></button>`)}${compliance}<div class="metric-grid">${metrics.map((metric) => `<article class="metric-card ${metric.highlight ? "metric-highlight" : ""}"><span>${icon(metric.icon, 15)} ${esc(metric.label)}</span><strong>${metric.value}</strong><p>${esc(metric.note)}</p></article>`).join("")}</div>${setup}<div class="overview-lower"><div class="overview-map-card"><div class="subsection-heading"><div><h2>Puntos de operación</h2><p>${esc(data.settings.service_area)} · sin rastreo continuo</p></div><span class="live-indicator"><span></span> SITIOS</span></div><div class="map-host taxi-map taxi-map-compact" data-map="overview"></div></div><div class="activity-card"><div class="subsection-heading"><div><h2>Actividad protegida</h2><p>Solo visible para administración maestra</p></div></div>${activity}</div></div>${active.length ? `<div class="overview-rides"><div class="subsection-heading"><div><h2>Servicios por atender</h2></div><button class="link-button" data-action="navigate" data-page="rides">Ver todos ${icon("chevron", 15)}</button></div><div class="rides-grid">${active.slice(0, 3).map((ride) => rideCard(ride, true, true)).join("")}</div></div>` : ""}</section>`;
  }

  function sites() {
    const data = state.data;
    const action = `<button class="primary-button top-action" data-action="open-site-modal">${icon("plus")}<span>Crear sitio</span></button>`;
    const cards = data.sites.map((site) => {
      const units = data.drivers.filter((driver) => driver.site_id === site.id);
      const pending = data.rides.filter((ride) => ride.site_id === site.id && ride.status === "requested");
      const tariffsCount = data.tariffs.filter((tariff) => tariff.active && normalize(tariff.town) === normalize(site.town)).length;
      return `<article class="site-card ${site.active ? "" : "site-suspended"}"><div class="site-card-heading">${site.photo_url ? `<img class="site-photo-thumb" src="${esc(site.photo_url)}" alt="${esc(site.name)}">` : `<span class="site-symbol">${icon("building", 23)}</span>`}<div><h3>${esc(site.name)}</h3><p>${esc(site.town)} · ${esc(site.manager_name)}</p>${site.legal_name ? `<small>${esc(site.legal_name)}</small>` : ""}</div><span class="driver-state ${site.active ? "state-available" : "state-suspended"}">${site.active ? "Activo" : "Suspendido"}</span></div><div class="site-card-contact"><span>${icon("users", 15)}${esc(site.email)}</span><span>${icon("phone", 15)}${esc(site.phone)}</span><span>${icon("clock", 15)}Control ${esc(site.dispatch_start || state.data.settings.site_dispatch_start)}–${esc(site.dispatch_end || state.data.settings.site_dispatch_end)}</span>${site.address ? `<span>${icon("pin", 15)}${esc(site.address)}</span>` : ""}</div><div class="site-card-numbers"><div><strong>${units.length}</strong><span>Unidades</span></div><div><strong>${pending.length}</strong><span>Solicitudes</span></div><div><strong>${tariffsCount}</strong><span>Destinos</span></div><div><strong>${site.eta_default_minutes}m</strong><span>Llegada</span></div></div><div class="site-card-actions"><button class="secondary-button" data-action="open-edit-site" data-id="${esc(site.id)}">${icon("settings", 15)} Editar sitio</button><a class="secondary-button site-agreement-link" href="/acuerdo-sitios.html?site=${encodeURIComponent(site.id)}" target="_blank" rel="noopener">${icon("shield", 15)} Acuerdo</a><button class="secondary-button" data-action="open-reset-site" data-id="${esc(site.id)}">${icon("key", 15)} Contraseña</button><button class="${site.active ? "suspend-button" : "reactivate-button"}" data-action="toggle-site" data-id="${esc(site.id)}">${site.active ? "Suspender sitio" : "Reactivar sitio"}</button></div></article>`;
    }).join("");
    return `<section class="content-section">${section("OPERACIÓN POR BASES AUTORIZADAS", "Sitios de taxis", "Crea accesos independientes para Sitio Turicato, Puruarán y futuras localidades.", action)}${cards ? `<div class="sites-grid">${cards}</div>` : empty("building", "Todavía no hay sitios autorizados", "Crea el primer sitio con su correo y contraseña. Cada sitio verá únicamente sus propios taxistas y servicios.", `<button class="primary-button empty-action" data-action="open-site-modal">${icon("plus")}<span>Crear primer sitio</span></button>`)}</section>`;
  }

  function tariffs(readonly = false) {
    const data = state.data;
    let rows = data.tariffs;
    if (state.townFilter !== "all" && !readonly) rows = rows.filter((row) => normalize(row.town) === normalize(state.townFilter));
    if (state.tariffSearch) {
      const search = normalize(state.tariffSearch);
      rows = rows.filter((row) => normalize(`${row.town} ${row.origin} ${row.destination}`).includes(search));
    }
    const towns = [...new Set(data.tariffs.map((row) => row.town))].sort();
    const actions = readonly ? "" : `<div class="button-pair"><button class="secondary-button" data-action="import-csv">${icon("plus", 15)} Importar CSV</button><button class="primary-button top-action" data-action="open-tariff-modal">${icon("plus")}<span>Nueva tarifa</span></button></div>`;
    const table = rows.length ? `<div class="tariff-table-wrap"><table class="tariff-table"><thead><tr><th>Localidad</th><th>Zona de origen</th><th>Destino</th><th>Servicio</th><th>Recogida</th><th>Total</th><th>Llegada</th>${readonly ? "" : "<th>Estado</th>"}</tr></thead><tbody>${rows.map((row) => `<tr class="${row.active ? "" : "tariff-inactive"}"><td>${esc(row.town)}</td><td>${esc(row.origin)}</td><td><strong>${esc(row.destination)}</strong></td><td>${money(row.service_fare)}</td><td>${money(row.pickup_fee)}</td><td><strong>${money(Number(row.service_fare) + Number(row.pickup_fee))}</strong></td><td>${row.eta_minutes} min</td>${readonly ? "" : `<td><button class="secondary-button tariff-edit-button" data-action="open-edit-tariff" data-id="${esc(row.id)}">Editar</button><button class="${row.active ? "suspend-button" : "reactivate-button"}" data-action="toggle-tariff" data-id="${esc(row.id)}">${row.active ? "Pausar" : "Activar"}</button></td>`}</tr>`).join("")}</tbody></table></div>` : empty("banknote", readonly ? "Sin tarifas autorizadas" : "Carga las tarifas de tus destinos", readonly ? "La administración maestra aún no ha cargado precios para esta localidad." : "Importa un archivo CSV o registra cada destino. El cobro se calcula por lugar, no por kilómetro.");
    return `<section class="content-section">${section(readonly ? "PRECIOS DE TU LOCALIDAD" : "TARIFARIO AUTORIZADO POR DESTINO", readonly ? "Tarifas autorizadas" : "Tarifas por destino", "Importe del traslado + cargo de recogida. No se realizan cálculos por kilómetros.", actions)}${readonly ? "" : `<div class="csv-help-card">${icon("banknote", 19)}<div><strong>Formato CSV:</strong><p>municipio, origen, destino, tarifa, recogida, eta_min, llegada, modo, recomendado, descuento_estudiante, latitud, longitud.</p><a href="/TARIFAS_EJEMPLO.csv" download>Descargar plantilla de ejemplo</a><small>Registra únicamente tarifas y cargos de recogida permitidos o autorizados por la autoridad competente.</small></div></div><input id="tariff-csv" type="file" accept=".csv,text/csv" hidden>`}<div class="tariff-toolbar"><label class="search-field">${icon("search", 16)}<input data-input="tariff-search" value="${esc(state.tariffSearch)}" placeholder="Buscar localidad o destino"></label>${readonly ? "" : `<select data-change="town-filter"><option value="all">Todas las localidades</option>${towns.map((town) => `<option value="${esc(town)}" ${state.townFilter === town ? "selected" : ""}>${esc(town)}</option>`).join("")}</select>`}</div>${table}</section>`;
  }

  function routeHistory() {
    const rows = state.data.route_history || [];
    const cards = rows.map((ride) => `<article class="audit-card"><div class="audit-card-top"><strong>${esc(ride.folio)}</strong>${rideStatus(ride.status)}</div><p>${esc(ride.site_name)}${ride.driver_name ? ` · ${esc(ride.driver_name)}` : ""}</p>${routePreview(ride.pickup_label, ride.destination_label, true)}<div class="audit-coordinate">${icon("pin", 15)} Última ubicación proporcionada: ${Number(ride.pickup_lat).toFixed(5)}, ${Number(ride.pickup_lng).toFixed(5)}</div>${ride.manual_locations?.length ? `<div class="audit-location-history"><strong>Puntos GPS ingresados manualmente</strong>${ride.manual_locations.map((point, index) => `<div><span>${index === 0 || point.kind === "initial" ? "Punto A original" : "Actualización voluntaria"}</span><strong>${Number(point.latitude).toFixed(5)}, ${Number(point.longitude).toFixed(5)}</strong><small>${esc(scheduleLabel(point.recorded_at))} · ${esc(point.label || "")}</small></div>`).join("")}</div>` : ""}<div class="audit-events">${(ride.events || []).map((event) => `<div><strong>${esc(when(event.at))}</strong><span>${esc(event.details || event.action)}</span></div>`).join("") || "<p>Registro anterior a la actualización.</p>"}</div></article>`).join("");
    const changes = (state.data.audit_log || []).map((entry) => `<article class="audit-change"><span>${esc(when(entry.created_at))}</span><strong>${esc(entry.description)}</strong><small>${esc(entry.actor_email)}</small></article>`).join("");
    return `<section class="content-section">${section("ACCESO EXCLUSIVO DEL PANEL MAESTRO", "Auditoría e historial completo", "Altas, suspensiones, reactivaciones, cambios de horarios, reportes, asignaciones y viajes; sin rastreo GPS continuo.")}<div class="privacy-card audit-privacy">${icon("shield")}<div><strong>Acceso restringido y proporcional</strong><p>Los sitios solo ven su operación; únicamente administración consulta coordenadas históricas y bitácora completa de modificaciones.</p></div></div>${changes ? `<div class="master-change-log"><div class="subsection-heading"><div><h2>Bitácora de todas las modificaciones</h2><p>${(state.data.audit_log || []).length} movimientos registrados: suspensiones, permisos, tarifas, cuentas y seguimiento.</p></div></div>${changes}</div>` : ""}${cards ? `<div class="subsection-heading audit-routes-heading"><div><h2>Historial protegido de servicios</h2></div></div><div class="audit-grid">${cards}</div>` : empty("shield", "Todavía no hay viajes auditables", "Cuando se registren servicios aparecerá aquí su historial protegido.")}</section>`;
  }

  function reports() {
    const data = state.data;
    const role = data.account.role;
    const labels = { speeding: "Exceso de velocidad", dangerous_overtake: "Rebase peligroso o en curva", unsafe_driving: "Conducción insegura", mistreatment: "Mal trato", overcharge: "Cobro indebido", vehicle: "Problema de la unidad", suggestion: "Comentario o sugerencia", other: "Otro incidente" };
    const allowedRides = data.rides.filter((ride) => ride.driver_id && ride.passenger_email === data.account.email);
    const action = role === "passenger" && allowedRides.length ? `<button class="primary-button top-action" data-action="open-report-modal">${icon("plus")}<span>Crear reporte</span></button>` : "";
    const cards = data.reports.map((report) => {
      const driver = data.drivers.find((item) => item.id === report.driver_id);
      const moderation = ["admin", "site"].includes(role) ? `<div class="report-actions"><button class="secondary-button" data-action="open-resolve-report" data-id="${esc(report.id)}">${report.status === "resolved" ? "Actualizar respuesta" : "Documentar medida"}</button>${driver ? `<button class="${driver.active ? "suspend-button" : "reactivate-button"}" data-action="toggle-driver" data-id="${esc(driver.id)}">${driver.active ? "Suspender taxi reportado" : "Reactivar unidad"}</button>` : ""}</div>` : "";
      return `<article class="report-card ${report.severity === "high" ? "report-urgent" : ""}"><div class="report-heading"><strong>${esc(labels[report.category] || report.category)}</strong><span class="report-status report-${esc(report.status)}">${report.status === "open" ? "Pendiente" : report.status === "reviewing" ? "En revisión" : "Atendido"}</span></div><p class="report-folio">Servicio ${esc(report.folio)} · ${esc(when(report.created_at))}${driver ? ` · Taxi ${esc(driver.unit_number)}` : ""}</p>${report.details ? `<p class="report-details">${esc(report.details)}</p>` : ""}${report.resolution ? `<div class="report-resolution"><strong>Medida registrada</strong><p>${esc(report.resolution)}</p></div>` : ""}${moderation}</article>`;
    }).join("");
    const note = role === "passenger" ? "Tus comentarios son revisados por el sitio responsable y la administración maestra; nunca se publican como acusaciones abiertas." : "Atiende maniobras peligrosas, exceso de velocidad, mal trato y cobros indebidos. Documenta la medida tomada y suspende la unidad si corresponde.";
    return `<section class="content-section">${section("CALIDAD Y SEGURIDAD VIAL", role === "passenger" ? "Mis comentarios y reportes" : "Reportes y medidas", note, action)}<div class="report-notice">${icon("shield", 19)} Los reportes sirven para prevención, investigación responsable y mejora del servicio. Emergencias: <a href="tel:911">911</a>.</div>${cards ? `<div class="reports-grid">${cards}</div>` : empty("shield", "No hay comentarios ni incidentes registrados", role === "passenger" ? "Cuando tengas un taxi asignado podrás reportar conducción riesgosa o compartir una sugerencia." : "Los comentarios de tus pasajeros aparecerán aquí para darles seguimiento.")}</section>`;
  }

  function sitePassengers() {
    const cards = state.data.passengers.map((person) => {
      const ridesCount = state.data.rides.filter((ride) => ride.passenger_email === person.email).length;
      return `<article class="passenger-directory-card">${photo(person.profile_photo_url, person.name, "driver-portrait")}<div><strong>${esc(person.name)}</strong><span>${ridesCount} ${ridesCount === 1 ? "servicio" : "servicios"} de tu sitio</span><small>${esc(person.phone || "Sin teléfono")}</small></div></article>`;
    }).join("");
    return `<section class="content-section">${section("PASAJEROS DE TU PROPIA OPERACIÓN", "Control de pasajeros", "Solo aparecen personas que solicitaron recogida fuera de tu sitio; no tienes acceso a clientes de otras bases.")}${cards ? `<div class="passenger-directory">${cards}</div>` : empty("users", "Todavía no hay pasajeros del sitio", "Los clientes aparecerán después de solicitar un servicio a tu base.")}</section>`;
  }

  function siteDashboard() {
    const data = state.data;
    const site = data.ownSite;
    const pending = data.rides.filter((ride) => ride.status === "requested");
    const active = data.rides.filter((ride) => ["accepted", "arrived", "in_progress"].includes(ride.status));
    const available = data.drivers.filter((driver) => driver.status === "available");
    const completed = data.rides.filter((ride) => ride.status === "completed");
    const metrics = [
      { label: "SOLICITUDES NUEVAS", value: pending.length, note: "Debes asignar una unidad", icon: "bell" },
      { label: "TAXIS DISPONIBLES", value: available.length, note: `${data.drivers.length} taxistas del sitio`, icon: "car" },
      { label: "SERVICIOS ACTIVOS", value: active.length, note: "Asignados o en recorrido", icon: "route" },
      { label: "SERVICIOS TERMINADOS", value: completed.length, note: `${money(completed.reduce((sum, ride) => sum + (ride.final_fare || ride.estimated_fare), 0))} registrados`, icon: "chart" },
    ];
    const waiting = pending.length ? `<div class="site-pending-section"><div class="subsection-heading"><div><h2>Solicitudes por asignar</h2><p>Selecciona un taxi y confirma el tiempo estimado de llegada.</p></div></div><div class="rides-grid">${pending.map((ride) => rideCard(ride, true, true)).join("")}</div></div>` : `<div class="site-ready-note">${icon("check", 19)} No hay solicitudes pendientes. Tus unidades disponibles aparecerán aquí.</div>`;
    return `<section class="content-section">${section(`SITIO AUTORIZADO · ${(site?.town || "").toUpperCase()}`, site?.name || "Central del sitio", "Asigna unidades de tu propia base, actualiza tiempos y supervisa tus servicios.")}<div class="metric-grid">${metrics.map((metric) => `<article class="metric-card"><span>${icon(metric.icon, 15)} ${esc(metric.label)}</span><strong>${metric.value}</strong><p>${esc(metric.note)}</p></article>`).join("")}</div>${waiting}${safetyCard(2, true)}</section>`;
  }

  function siteDrivers() {
    const cards = state.data.drivers.map((driver) => {
      const pending = state.data.reports.filter((report) => report.driver_id === driver.id && report.status !== "resolved").length;
      return `<article class="driver-card ${driver.active ? "" : "driver-suspended"}"><div class="driver-card-top">${photo(driver.driver_photo_url, driver.name, "driver-portrait")}<div><h3>${esc(driver.name)}</h3><span>Unidad ${esc(driver.unit_number)} · ${esc(driver.plate)}</span></div><span class="driver-state state-${esc(driver.status)}">${esc({ available: "Disponible", busy: "En viaje", offline: "No visible", suspended: "Suspendido" }[driver.status] || driver.status)}</span></div>${driver.vehicle_photo_url ? `<img class="vehicle-photo-card" src="${esc(driver.vehicle_photo_url)}" alt="Taxi ${esc(driver.unit_number)}" loading="lazy">` : ""}<div class="driver-details"><span>${icon("car", 16)}${esc(driver.vehicle)} · ${esc(driver.vehicle_color)}</span><span>${icon("shield", 16)}${driver.insurance_valid ? "Seguro vigente" : "Seguro pendiente o vencido"}</span><span>${icon("clock", 16)}Horario personal ${esc(driver.shift_start || "06:00")}–${esc(driver.shift_end || "22:00")}</span>${pending ? `<span class="compliance-bad">${icon("bell", 16)} ${pending} reporte${pending === 1 ? "" : "s"} por atender</span>` : ""}</div>${driver.active ? `<button class="${driver.status === "available" ? "secondary-button" : "primary-button"} site-status-button" data-action="toggle-driver-status" data-id="${esc(driver.id)}" ${driver.status === "busy" ? "disabled" : ""}>${driver.status === "available" ? "Quitar visibilidad a la unidad" : driver.status === "busy" ? "Unidad en servicio" : "Marcar disponible"}</button>` : ""}<button class="${driver.active ? "suspend-button" : "reactivate-button"} site-discipline-button" data-action="toggle-driver" data-id="${esc(driver.id)}" ${driver.status === "busy" ? "disabled" : ""}>${driver.active ? "Suspender conductor" : "Reactivar conductor"}</button></article>`;
    }).join("");
    return `<section class="content-section">${section("UNIDADES DE TU SITIO", "Mis taxistas", "Solo puedes ver y operar las unidades asignadas a esta base.")}${cards ? `<div class="drivers-grid">${cards}</div>` : empty("car", "Tu sitio aún no tiene unidades", "Solicita a la administración maestra que registre y autorice tus taxistas.")}</section>`;
  }

  function siteSettings() {
    const site = state.data.ownSite;
    return `<section class="content-section">${section("CONFIGURACIÓN DE TU SITIO", "Llegada y contacto", "Define el tiempo sugerido de recogida y consulta tu acuerdo operativo personalizado.")}<form class="settings-form" data-form="site-settings"><div class="settings-block"><div class="settings-block-title">${icon("clock")}<div><h2>Tiempo estimado de recogida</h2><p>El pasajero solo verá este tiempo después de que se asigne un taxista.</p></div></div><label class="form-field"><span>Minutos sugeridos para la asignación</span><input name="etaMinutes" type="number" min="1" max="120" required value="${site.eta_default_minutes}"></label></div><div class="settings-block"><div class="form-grid"><label class="form-field"><span>Teléfono del sitio</span><input name="phone" value="${esc(site.phone)}" inputmode="tel"></label><label class="form-field"><span>Dirección de la base</span><input name="address" value="${esc(site.address)}"></label></div></div><div class="site-agreement-summary"><strong>${esc(site.legal_name || site.name)}</strong><span>Representante: ${esc(site.legal_representative || site.manager_name)}</span><a class="secondary-button site-agreement-link" href="/acuerdo-sitios.html?site=${encodeURIComponent(site.id)}" target="_blank" rel="noopener">${icon("shield", 16)} Abrir acuerdo personalizado e imprimir</a></div><input type="hidden" name="siteId" value="${esc(site.id)}"><button class="primary-button settings-save" type="submit">${icon("check")}<span>Guardar operación</span></button></form></section>`;
  }

  function organizations() {
    const data = state.data;
    const activeUnions = data.unions.filter((union) => union.active).length;
    const heading = `<div class="button-pair"><button class="secondary-button" data-action="open-group-modal" ${activeUnions ? "" : "disabled"}>${icon("plus")} Grupo</button><button class="primary-button top-action" data-action="open-union-modal">${icon("plus")}<span>Sindicato</span></button></div>`;
    const cards = data.unions.map((union) => {
      const groups = data.groups.filter((group) => group.parent_id === union.id);
      const count = data.drivers.filter((driver) => driver.union_id === union.id).length;
      const groupList = groups.length ? `<div>${groups.map((group) => `<span class="group-label ${group.active ? "" : "group-inactive"}"><span style="background:${esc(group.color)}"></span>${esc(group.name)}<button data-action="toggle-organization" data-id="${esc(group.id)}" aria-label="Cambiar estado del grupo">${group.active ? "✓" : "○"}</button></span>`).join("")}</div>` : "<p>Este sindicato todavía no tiene grupos.</p>";
      return `<article class="organization-card ${union.active ? "" : "organization-inactive"}"><div class="organization-head"><span class="organization-mark" style="background:${esc(union.color)}">${icon("building")}</span><div><h3>${esc(union.name)}</h3><p>${count} ${count === 1 ? "unidad" : "unidades"} · ${groups.length} ${groups.length === 1 ? "grupo" : "grupos"}</p></div><button class="state-toggle ${union.active ? "state-on" : ""}" data-action="toggle-organization" data-id="${esc(union.id)}" aria-label="Cambiar estado del sindicato"><span></span></button></div>${union.contact_name ? `<div class="organization-contact">${icon("users", 15)}${esc(union.contact_name)}${union.phone ? `<span>· ${esc(union.phone)}</span>` : ""}</div>` : ""}<div class="organization-groups"><span>GRUPOS REGISTRADOS</span>${groupList}</div></article>`;
    }).join("");
    return `<section class="content-section">${section("ORGANIZACIÓN DE TAXISTAS", "Sindicatos y grupos", "Tú decides qué organizaciones y bases pueden operar.", heading)}<div class="organization-metrics"><div><strong>${activeUnions}</strong><span>Sindicatos activos</span></div><div><strong>${data.groups.filter((group) => group.active).length}</strong><span>Grupos autorizados</span></div><div><strong>${data.drivers.filter((driver) => driver.active).length}</strong><span>Taxistas registrados</span></div></div>${cards ? `<div class="organizations-grid">${cards}</div>` : empty("building", "Tu central todavía no tiene sindicatos", "Comienza registrando un sindicato; después podrás crear sus grupos y dar de alta a sus taxistas.", `<button class="primary-button empty-action" data-action="open-union-modal">${icon("plus")}<span>Registrar el primer sindicato</span></button>`)}</section>`;
  }

  function driverCard(driver) {
    const labels = { available: "Disponible", busy: "En viaje", suspended: "Suspendido", offline: "Desconectado" };
    return `<article class="driver-card ${driver.active ? "" : "driver-suspended"}"><div class="driver-card-top">${photo(driver.driver_photo_url, driver.name, "driver-portrait")}<div><h3>${esc(driver.name)}</h3><span>${esc(driver.site_name || "Sin sitio asignado")} · ${esc(driver.union_name)}</span></div><span class="driver-state state-${esc(driver.status)}">${esc(labels[driver.status] || driver.status)}</span></div>${driver.vehicle_photo_url ? `<img class="vehicle-photo-card" src="${esc(driver.vehicle_photo_url)}" alt="Fotografía del taxi ${esc(driver.unit_number)}" loading="lazy">` : `<div class="vehicle-photo-missing">${icon("car", 19)} Fotografía de la unidad pendiente</div>`}<div class="driver-unit-strip"><div><span>UNIDAD</span><strong>${esc(driver.unit_number)}</strong></div><div><span>PLACAS</span><strong>${esc(driver.plate)}</strong></div><div><span>CALIFICACIÓN</span><strong>★ ${Number(driver.rating).toFixed(1)}</strong></div></div><div class="driver-details"><span>${icon("car", 16)}${esc(driver.vehicle)} · ${esc(driver.vehicle_color)}</span><span>${icon("pin", 16)}${esc(driver.zone)}</span><span class="${driver.insurance_valid ? "compliance-good" : "compliance-bad"}">${icon("shield", 16)}${driver.insurance_valid ? `Seguro vigente hasta ${esc(driver.insurance_expiration)}` : "Seguro pendiente o vencido"}</span>${driver.phone ? `<span>${icon("phone", 16)}${esc(driver.phone)}</span>` : ""}</div><div class="driver-card-actions"><button class="driver-documents-button" data-action="open-driver-documents" data-id="${esc(driver.id)}">${icon("shield", 15)} Fotos y documentos</button><div class="driver-admin-actions"><button class="reset-password-button" data-action="open-reset-password" data-id="${esc(driver.id)}" title="Cambiar contraseña">${icon("key", 15)}</button><button class="${driver.active ? "suspend-button" : "reactivate-button"}" data-action="toggle-driver" data-id="${esc(driver.id)}">${driver.active ? "Suspender" : "Reactivar"}</button></div></div></article>`;
  }

  function drivers() {
    const data = state.data;
    const unions = data.unions.filter((union) => union.active);
    const filtered = data.drivers.filter((driver) => (state.unionFilter === "all" || driver.union_id === state.unionFilter) && `${driver.name} ${driver.plate} ${driver.unit_number}`.toLowerCase().includes(state.driverSearch.toLowerCase()));
    const filters = data.drivers.length ? `<div class="driver-filters"><label class="search-box">${icon("search")}<input data-input="driver-search" placeholder="Buscar por nombre, placas o unidad…" value="${esc(state.driverSearch)}"></label><select data-change="union-filter"><option value="all">Todos los sindicatos</option>${unions.map((union) => `<option value="${esc(union.id)}" ${state.unionFilter === union.id ? "selected" : ""}>${esc(union.name)}</option>`).join("")}</select></div>` : "";
    return `<section class="content-section">${section("UNIDADES AUTORIZADAS", "Taxistas registrados", "Solo tú puedes dar de alta, verificar o suspender conductores.", `<button class="primary-button top-action" data-action="open-driver-modal">${icon("plus")}<span>Dar de alta</span></button>`)}${filters}${filtered.length ? `<div class="drivers-grid">${filtered.map(driverCard).join("")}</div>` : empty("car", data.drivers.length ? "No encontramos coincidencias" : "Todavía no hay unidades registradas", data.drivers.length ? "Prueba otro nombre, número de unidad o sindicato." : "Los taxistas no pueden inscribirse por su cuenta. Tú autorizas cada unidad.", `<button class="primary-button empty-action" data-action="open-driver-modal">${icon("plus")}<span>${unions.length ? "Registrar primer taxista" : "Primero registra un sindicato"}</span></button>`)}</section>`;
  }

  function rideCard(ride, showPassenger = false, admin = false) {
    const person = showPassenger ? `<div class="ride-person">${photo(ride.passenger_photo_url, ride.passenger_name, "avatar-small driver-portrait")}<span>${esc(ride.passenger_name)}</span>${ride.passenger_phone ? `<a class="ride-call" href="tel:${esc(String(ride.passenger_phone).replace(/[^\d+]/g, ""))}" aria-label="Llamar al pasajero">${icon("phone", 16)}</a>` : ""}</div>` : ride.driver_name ? `<div class="ride-person">${photo(ride.driver_photo_url, ride.driver_name, "avatar-small driver-portrait")}<span>${esc(ride.driver_name)} · Unidad ${esc(ride.driver_unit)}</span></div>` : "";
    const available = state.data.drivers.filter((driver) => driver.active && driver.site_id === ride.site_id && driver.documents_valid &&
      (driver.status === "available" || (driver.status === "busy" && ride.share_requested_driver_id === driver.id &&
        Number(driver.available_seats) >= Number(ride.passengers))));
    let actions = "";
    if (admin && ride.status === "requested") {
      const confirmation = ride.price_requires_confirmation ? `<div class="special-price-confirmation"><label><span>Valida el punto B y confirma la tarifa por persona</span><input type="number" min="0" max="${state.data.settings.special_max_per_person}" value="${ride.unit_fare ?? ""}" placeholder="Importe autorizado" data-special-price="${esc(ride.id)}"></label><button class="secondary-button" data-action="confirm-special" data-id="${esc(ride.id)}">Validar destino y confirmar tarifa</button></div>` : "";
      actions = confirmation + (available.length ? `<div class="manual-assignment"><label><span>Unidad del sitio</span><select data-assignment="${esc(ride.id)}">${available.map((driver) => `<option value="${esc(driver.id)}">Unidad ${esc(driver.unit_number)} · ${esc(driver.name)} · ${driver.available_seats ?? 4} lugar(es)</option>`).join("")}</select></label><label class="eta-assignment"><span>Tiempo de llegada que verá el pasajero</span><div><input type="number" min="1" max="180" value="${Number(ride.eta_minutes) || state.data.settings.default_eta_minutes}" data-eta="${esc(ride.id)}"><strong>min</strong></div></label><button class="primary-button action-wide" data-action="assign-ride" data-id="${esc(ride.id)}" ${ride.price_requires_confirmation ? "disabled" : ""}><span>Asignar taxi y avisar al pasajero</span>${icon("arrow")}</button></div>` : "<div class=\"manual-assignment\"><p>No hay taxis autorizados con plazas disponibles para este servicio.</p></div>");
    } else if (admin && ["accepted", "arrived"].includes(ride.status)) {
      actions = `<div class="eta-update-box"><span>Llegada informada: <strong>${ride.eta_minutes} min</strong></span><button class="link-button" data-action="open-eta-modal" data-id="${esc(ride.id)}">Modificar tiempo</button></div>`;
    }
    if (admin && ["requested", "accepted", "arrived"].includes(ride.status)) actions += `<button class="text-danger-button cancel-small" data-action="cancel-ride" data-id="${esc(ride.id)}">Cancelar viaje</button>`;
    if (!admin && state.data.account.role === "passenger" && ride.driver_id) actions += `<button class="link-button report-trip-button" data-action="open-report-modal" data-id="${esc(ride.id)}">${icon("shield", 15)} Comentar o reportar servicio</button>`;
    const pendingPrice = ride.price_requires_confirmation || ride.estimated_fare === null || ride.estimated_fare === undefined;
    const price = pendingPrice ? "Destino por validar" : money(ride.final_fare ?? ride.estimated_fare);
    const eta = ride.driver_id && ride.eta_minutes ? `${ride.eta_minutes} min` : "Esperando taxista";
    const breakdown = pendingPrice ? "El sitio debe validar el punto B y confirmar el precio antes de asignar la unidad." :
      `Traslado ${money(ride.service_fare ?? ride.estimated_fare)} + recogida ${money(ride.pickup_fee || 0)}${ride.discount_amount ? ` − descuento ${money(ride.discount_amount)}` : ""} · efectivo`;
    return `<article class="ride-card"><div class="ride-card-head"><div><span class="folio-label">${esc(ride.folio)}</span><span class="ride-time">${esc(when(ride.created_at))}</span></div>${rideStatus(ride.status)}</div>${ride.site_name ? `<div class="ride-site-label">${icon("building", 14)} ${esc(ride.site_name)}</div>` : ""}${ride.scheduled_at ? `<div class="scheduled-ride-label">${icon("clock", 14)} Programado: ${esc(scheduleLabel(ride.scheduled_at))}</div>` : ""}${ride.shared_service ? `<div class="shared-ride-label">${icon("users", 14)} Lugar en unidad compartida</div>` : ""}${routePreview(ride.pickup_label, ride.destination_label, true)}${ride.arrival_point ? `<p class="arrival-note">Llegada: ${esc(ride.arrival_point)}</p>` : ""}<div class="ride-card-meta"><span>${icon("clock", 15)}${esc(eta)}</span><span>${icon("users", 15)}${ride.passengers}</span><strong>${esc(price)}</strong></div><div class="ride-price-breakdown">${esc(breakdown)}</div>${person}${showPassenger && ride.pickup_photo_url ? `<img class="pickup-reference-photo" src="${esc(ride.pickup_photo_url)}" alt="Fotografía del lugar de recogida" loading="lazy">` : ""}${actions ? `<div class="ride-card-actions">${actions}</div>` : ""}</article>`;
  }

  function rides(admin) {
    const data = state.data;
    const isDriver = data.account.role === "driver";
    const own = isDriver ? data.rides.filter((ride) => ride.driver_id === data.ownDriver?.id) : data.rides;
    const list = own.filter((ride) => state.rideFilter === "all" || (state.rideFilter === "active" && ACTIVE.includes(ride.status)) || ride.status === state.rideFilter);
    const filters = [["all", "Todos"], ["active", "Activos"], ["completed", "Completados"], ["cancelled", "Cancelados"]];
    const isSite = data.account.role === "site";
    return `<section class="content-section">${section(admin ? (isSite ? "DESPACHO EXCLUSIVO DE TU SITIO" : "DESPACHO DE TODOS LOS SITIOS") : "HISTORIAL DE SERVICIOS", admin ? "Servicios y solicitudes" : isDriver ? "Mis servicios" : isSite ? "Historial de mi sitio" : "Mis viajes", admin ? "Asigna una unidad del mismo sitio e informa el tiempo estimado al pasajero." : "Consulta lugares, unidades, importes y estados de los servicios autorizados.")}<div class="filter-row">${filters.map(([key, label]) => `<button class="quick-chip ${state.rideFilter === key ? "quick-chip-active" : ""}" data-action="ride-filter" data-value="${key}">${esc(label)}</button>`).join("")}</div>${list.length ? `<div class="rides-grid">${list.map((ride) => rideCard(ride, admin || isDriver || isSite, admin)).join("")}</div>` : empty("route", "Todavía no hay viajes en esta sección", "Cuando se registre un servicio aparecerá aquí con todos sus detalles.")}</section>`;
  }

  function activeRidePanel(ride) {
    const headline = { requested: "Esperando taxista", accepted: "Tu taxi viene por ti", arrived: "Tu taxi ya está aquí", in_progress: "Buen viaje" }[ride.status];
    const detail = ride.status === "requested" ? ride.price_requires_confirmation ? `${ride.site_name || "Tu sitio"} validará primero el punto B y confirmará el precio autorizado.` :
      `${ride.site_name || "Tu sitio"} está buscando una unidad autorizada; el tiempo aparecerá cuando un taxista acepte.` : `Tu servicio fue asignado por ${ride.site_name || "un sitio autorizado"}.`;
    const driver = ride.driver_name ? `<div class="assigned-driver-highlight">${ride.vehicle_photo_url ? `<img class="assigned-vehicle-photo" src="${esc(ride.vehicle_photo_url)}" alt="Fotografía de la unidad ${esc(ride.driver_unit)}">` : ""}<div class="assigned-driver">${photo(ride.driver_photo_url, ride.driver_name, "driver-portrait")}<div><strong>${esc(ride.driver_name)}</strong><span>Taxi ${esc(ride.driver_unit)} · Placas ${esc(ride.driver_plate)}</span><small>${esc(ride.driver_vehicle)} · ${esc(ride.driver_vehicle_color || "")} · ${esc(ride.site_name)}</small></div>${ride.driver_phone ? `<a class="round-contact" href="tel:${esc(String(ride.driver_phone).replace(/[^\d+]/g, ""))}" aria-label="Llamar al taxista">${icon("phone")}</a>` : ""}</div></div>` : "";
    const eta = ["accepted", "arrived"].includes(ride.status) && ride.driver_id && ride.eta_minutes ? `<div class="eta-passenger-box">${icon("clock", 19)}<div><strong>${ride.eta_minutes} minutos</strong><span>Tiempo informado por tu taxista o sitio</span></div></div>` : "";
    const code = ride.security_code && ride.status !== "in_progress" ? `<div class="security-code-box"><div><span>CÓDIGO DE SEGURIDAD</span><strong>${esc(ride.security_code)}</strong></div><p>Compártelo únicamente cuando estés junto al taxista.</p></div>` : "";
    const fare = ride.price_requires_confirmation || ride.estimated_fare === null ?
      '<aside class="pending-fare-card"><strong>Precio pendiente de validación</strong><span>El sitio debe confirmar primero el destino y la tarifa autorizada.</span></aside>' :
      `<div class="fare-lines"><span>Servicio a ${esc(ride.destination_label)} <strong>${money(ride.service_fare ?? ride.estimated_fare)}</strong></span><span>Cargo de recogida <strong>${money(ride.pickup_fee || 0)}</strong></span>${ride.discount_amount ? `<span>Descuentos autorizados <strong>−${money(ride.discount_amount)}</strong></span>` : ""}</div><div class="fare-summary"><span>Total confirmado</span><strong>${money(ride.estimated_fare)}</strong></div>`;
    const schedule = ride.scheduled_at ? `<div class="scheduled-ride-label">${icon("clock", 16)} Recogida programada: ${esc(scheduleLabel(ride.scheduled_at))}</div>` : "";
    const update = `<button class="secondary-button share-ride-button" data-action="update-ride-location" data-id="${esc(ride.id)}">${icon("refresh", 17)} Actualizar mi posición manualmente</button>${ride.location_updated_at ? `<small class="manual-location-note">Última actualización manual: ${esc(when(ride.location_updated_at))}. Sin seguimiento continuo.</small>` : ""}`;
    const sharing = `<div class="ride-share-options"><button class="secondary-button share-ride-button" data-action="share-google-maps" data-id="${esc(ride.id)}">${icon("pin", 17)} Abrir ubicación en Google Maps</button><button class="secondary-button share-ride-button" data-action="share-whatsapp" data-id="${esc(ride.id)}">${icon("users", 17)} Compartir ubicación por WhatsApp</button></div>`;
    return `<section class="content-section passenger-live">${section("TU SERVICIO", ride.status === "requested" ? "Solicitud enviada" : "Tu viaje está en marcha", "Puedes actualizar tu posición solo cuando tú lo decidas; nunca hay seguimiento GPS continuo.")}<div class="passenger-layout"><div class="ride-live-panel">${rideStatus(ride.status)}<h2>${esc(headline)}</h2><p class="live-subtitle">${esc(detail)}</p>${schedule}${eta}${routePreview(ride.pickup_label, ride.destination_label)}${driver}${code}${fare}${update}${sharing}${ride.status !== "in_progress" ? `<button class="text-danger-button" data-action="cancel-ride" data-id="${esc(ride.id)}">Cancelar solicitud</button>` : ""}<a class="emergency-link" href="tel:911">${icon("shield", 15)} Emergencias: 911</a>${safetyCard(ride.status === "requested" ? 1 : ride.status === "accepted" ? 4 : 0)}</div><div class="map-host taxi-map" data-map="ride" data-id="${esc(ride.id)}"></div></div></section>`;
  }

  function passenger() {
    const data = state.data;
    const current = data.rides.find((ride) => ride.passenger_email === data.account.email && ACTIVE.includes(ride.status));
    if (current) return activeRidePanel(current);
    const draft = state.draft;
    const quote = calculateQuote();
    const available = data.drivers.filter((driver) => driver.status === "available" && driver.site_id === draft.siteId).length;
    const destinations = siteTariffs().sort((first, second) => Number(second.recommended !== false) - Number(first.recommended !== false));
    const site = data.sites.find((item) => item.id === draft.siteId);
    const selectedDestination = quote?.tariff?.destination || draft.specialDestination;
    const opportunities = (data.shared_opportunities || []).filter((item) => item.site_id === draft.siteId &&
      selectedDestination && normalize(item.destination_label) === normalize(selectedDestination));
    const shared = sharedOpportunity();
    const capacity = passengerCapacity();
    const newest = data.rides.find((ride) => ride.passenger_email === data.account.email && ride.status === "completed" && !ride.rating);
    const rating = newest ? `<div class="rating-card"><div><h3>¿Cómo estuvo tu último viaje?</h3><p>Califica a ${esc(newest.driver_name || "tu taxista")}.</p></div><div class="rating-stars">${[1, 2, 3, 4, 5].map((value) => `<button class="star-on" data-action="rate-ride" data-id="${esc(newest.id)}" data-value="${value}" aria-label="${value} estrellas">★</button>`).join("")}</div></div>` : "";

    const disabled = !draft.siteId || (!draft.tariffId && draft.specialDestination.trim().length < 3) || !draft.safetyAccepted ||
      (draft.children > 0 && !draft.childSafetyAccepted) || draft.passengers + draft.children > capacity ||
      (draft.scheduleMode === "scheduled" && !draft.scheduledAt) || !data.settings.service_enabled || needsLegalAcceptance();
    const recommendations = destinations.filter((item) => item.recommended !== false).slice(0, 8).map((item) => `<button class="destination-chip ${draft.tariffId === item.id ? "destination-chip-active" : ""}" data-action="quick-destination" data-id="${esc(item.id)}">${esc(item.destination)}</button>`).join("");
    const counters = `<div class="rider-composition"><div class="passenger-count"><div>${icon("users")}<span>Personas que pagan</span></div><div><button data-action="passengers-minus" ${draft.passengers <= 1 ? "disabled" : ""}>−</button><strong>${draft.passengers}</strong><button data-action="passengers-plus" ${draft.passengers + draft.children >= capacity ? "disabled" : ""}>+</button></div></div><div class="passenger-count"><div>${icon("users")}<span>Menores con exención autorizada</span></div><div><button data-action="children-minus" ${draft.children <= 0 ? "disabled" : ""}>−</button><strong>${draft.children}</strong><button data-action="children-plus" ${draft.passengers + draft.children >= capacity ? "disabled" : ""}>+</button></div></div>${data.settings.discounts_authorized ? `<label class="form-field compact-field"><span>Acompañantes adultos mayores</span><select data-change="senior-count">${Array.from({ length: draft.passengers + 1 }, (_, index) => `<option value="${index}" ${draft.seniors === index ? "selected" : ""}>${index}</option>`).join("")}</select></label><label class="form-field compact-field"><span>Estudiantes con descuento autorizado</span><select data-change="student-count">${Array.from({ length: draft.passengers + 1 }, (_, index) => `<option value="${index}" ${draft.students === index ? "selected" : ""}>${index}</option>`).join("")}</select></label>` : ""}</div>`;
    const minors = draft.children ? `<aside class="child-safety-note"><strong>Menores de hasta ${Number(data.settings.child_free_max_age)} años: exención solo si está autorizada.</strong><p>Cada menor ocupa una plaza. Debe viajar atrás con cinturón o sistema de retención según edad, talla y ley. Está prohibido viajar en las piernas.</p><label class="consent-check"><input type="checkbox" data-change="child-safety" ${draft.childSafetyAccepted ? "checked" : ""}><span>Confirmo la protección correcta de cada menor.</span></label></aside>` : "";
    const sharedCards = opportunities.length && draft.scheduleMode !== "scheduled" ? `<div class="shared-opportunities"><strong>${icon("car", 17)} Taxis que ya van hacia ${esc(selectedDestination)}</strong>${opportunities.map((item) => `<button class="shared-opportunity-card ${shared?.ride_id === item.ride_id ? "shared-opportunity-selected" : ""}" data-action="choose-shared" data-id="${esc(item.ride_id)}"><span>${item.available_seats === 1 ? "Solo queda 1 lugar" : `Quedan ${item.available_seats} lugares`}</span><small>El conductor confirmará si puede pasar por tu zona.</small>${shared?.ride_id === item.ride_id ? icon("check", 17) : icon("arrow", 17)}</button>`).join("")}${shared ? '<button class="link-button" data-action="clear-shared">Prefiero solicitar otra unidad</button>' : ""}</div>` : "";
    const scheduling = `<label class="form-field schedule-selector"><span>¿CUÁNDO NECESITAS EL TAXI?</span><select data-change="schedule-mode"><option value="now" ${draft.scheduleMode === "now" ? "selected" : ""}>Solicitar ahora</option><option value="scheduled" ${draft.scheduleMode === "scheduled" ? "selected" : ""}>Programar fecha y hora</option></select></label>${draft.scheduleMode === "scheduled" ? `<label class="form-field schedule-datetime"><span>Fecha y hora deseadas para recogerte</span><input type="datetime-local" data-change="scheduled-at" value="${esc(draft.scheduledAt)}" required><small>El sitio verá la solicitud programada y asignará una unidad autorizada.</small></label>` : ""}`;
    const estimate = !quote ? "" : quote.pending ? '<aside class="pending-fare-card"><strong>Precio pendiente de validación</strong><span>Tu sitio validará primero el punto B y después confirmará el importe autorizado.</span></aside>' :
      `<div class="fare-lines"><span>Tarifa a ${esc(quote.tariff.destination)} <strong>${money(quote.service)}</strong></span><span>Cargo por recogerte <strong>${money(quote.pickup)}</strong></span>${quote.discount ? `<span>Descuentos autorizados <strong>−${money(quote.discount)}</strong></span>` : ""}</div><div class="fare-estimate"><div><span>TOTAL ESTIMADO</span><strong>${money(quote.fare)}</strong></div><small>El tiempo se informa después de asignar un taxista.</small></div>`;
    return `<section class="content-section">${section("RECOGIDA FUERA DEL SITIO · EFECTIVO", "¿A dónde te llevamos?", "Selecciona tu localidad; tú decides cuándo compartir o actualizar tu ubicación GPS.")}<div class="passenger-layout"><div class="ride-builder"><label class="form-field passenger-site-selector"><span>LOCALIDAD Y SITIO RESPONSABLE</span><select data-change="passenger-site" ${data.sites.length ? "" : "disabled"}>${data.sites.length ? data.sites.map((item) => `<option value="${esc(item.id)}" ${draft.siteId === item.id ? "selected" : ""}>${esc(item.town)} · ${esc(item.name)}</option>`).join("") : '<option>No hay sitios autorizados</option>'}</select></label>${site?.photo_url ? `<div class="selected-site-photo"><img src="${esc(site.photo_url)}" alt="${esc(site.name)}"><span>${esc(site.name)}<small>Horario de base ${esc(site.dispatch_start || data.settings.site_dispatch_start)}–${esc(site.dispatch_end || data.settings.site_dispatch_end)}</small></span></div>` : ""}<div class="builder-route"><div class="location-input-row location-focused" data-action="select-pickup"><span class="location-indicator indicator-green"></span><span><small>RECOGIDA FUERA DE LA BASE · GPS MANUAL</small><input data-input="pickup-label" placeholder="¿Dónde debe recogerte el taxi?" value="${esc(draft.pickup.label)}"></span><button class="location-gps gps-button" data-action="locate-me" aria-label="Usar mi ubicación actual">${icon("location")}</button></div><label class="form-field pickup-photo-field"><span>Foto de fachada o punto de recogida · opcional</span><input id="pickup-photo" type="file" accept="image/jpeg,image/png,image/webp" data-change="pickup-photo"><small>${draft.pickupPhotoName ? `Fotografía lista: ${esc(draft.pickupPhotoName)}` : "La foto solo la consultan tu sitio y el taxi asignado."}</small></label><div class="recommendation-block"><span>DESTINOS RECOMENDADOS DESDE ${esc((site?.town || "TU LOCALIDAD").toUpperCase())}</span><div class="destination-chips">${recommendations || "La administración agregará las rutas de esta localidad."}</div></div><label class="form-field destination-selector"><span>DESTINO Y TARIFA POR PERSONA O VIAJE</span><select data-change="passenger-tariff"><option value="">${destinations.length ? "Selecciona un destino o escribe una salida especial" : "Usa una salida especial"}</option>${destinations.map((tariff) => `<option value="${esc(tariff.id)}" ${draft.tariffId === tariff.id ? "selected" : ""}>${esc(tariff.destination)} · ${money(tariff.service_fare)} ${tariff.price_mode === "trip" ? "por viaje" : "por persona"}</option>`).join("")}</select>${quote?.tariff?.arrival_point ? `<small>Llegada predeterminada: ${esc(quote.tariff.arrival_point)}</small>` : ""}</label><label class="form-field special-destination"><span>¿Tu ruta no aparece? Salida especial</span><input data-input="special-destination" value="${esc(draft.specialDestination)}" placeholder="Escribe otro lugar de destino"><small>El sitio primero validará el punto B y después confirmará el precio autorizado.</small></label></div>${scheduling}${sharedCards}${counters}${minors}<p class="capacity-note">${shared ? `Esta unidad compartida solo dispone de ${capacity} ${capacity === 1 ? "lugar" : "lugares"}.` : "Máximo 4 ocupantes en total."} Los menores también ocupan una plaza y deben viajar protegidos.</p><div class="cash-only-banner">${icon("banknote", 18)} Pago únicamente en efectivo al conductor.</div><textarea class="notes-input" data-input="ride-notes" rows="2" maxlength="240" placeholder="Referencia: portón azul, tienda, señas para identificarte…">${esc(draft.notes)}</textarea>${estimate}${safetyCard(0)}<label class="consent-check safety-check"><input type="checkbox" data-change="safety-consent" ${draft.safetyAccepted ? "checked" : ""}><span>Verificaré placas y conductor, usaré cinturón y respetaré la capacidad y seguridad infantil.</span></label><button class="primary-button request-button" data-action="request-ride" ${disabled ? "disabled" : ""}><span>${data.settings.service_enabled ? draft.scheduleMode === "scheduled" ? "Revisar y programar taxi" : "Revisar y solicitar taxi" : "Servicio temporalmente en pausa"}</span>${icon("arrow")}</button><div class="availability-note ${available || shared ? "" : "availability-empty"}"><span></span>${available ? `${available} ${available === 1 ? "taxista disponible" : "taxistas disponibles"} en ${esc(site?.name || "tu sitio")}` : shared ? "Puedes pedir un lugar en una unidad que va de paso." : "Una unidad autorizada podrá tomar tu solicitud"}</div></div><div class="map-host taxi-map" data-map="request"></div></div>${rating}</section>`;
  }

  function selectedDriver(preview) {
    if (!preview) return state.data.ownDriver;
    return state.data.drivers.find((driver) => driver.id === state.selectedDriver) || state.data.drivers[0] || null;
  }

  function driverPanel(preview) {
    const data = state.data;
    const driver = selectedDriver(preview);
    if (!driver) return `<section class="content-section">${section("PANEL DE UNIDAD", "Operación de taxistas")}${empty("car", "Aún no hay taxistas autorizados", "Primero registra un sindicato y da de alta al menos a un taxista.")}</section>`;
    const activeRides = data.rides.filter((ride) => ride.driver_id === driver.id && ["accepted", "arrived", "in_progress"].includes(ride.status));
    const current = activeRides.find((ride) => ride.id === state.selectedActiveRide) || activeRides[0];
    const occupied = Number(driver.occupied_seats || activeRides.reduce((total, ride) => total + Number(ride.passengers || 0), 0));
    const seats = Math.max(0, 4 - occupied);
    const statusLabel = driver.status === "available" ? "Disponible" : driver.status === "busy" ? "En servicio" : "Desconectado";
    const button = `<button class="availability-switch ${driver.status === "available" ? "switch-available" : driver.status === "busy" ? "switch-busy" : ""}" data-action="toggle-driver-status" data-id="${esc(driver.id)}" ${driver.status === "busy" ? "disabled" : ""}><span></span>${statusLabel}</button>`;
    const picker = preview && data.drivers.length > 1 ? `<div class="driver-preview-picker">${icon("car")}<select data-change="preview-driver">${data.drivers.map((item) => `<option value="${esc(item.id)}" ${item.id === driver.id ? "selected" : ""}>Unidad ${esc(item.unit_number)} · ${esc(item.name)}</option>`).join("")}</select></div>` : "";
    const summary = `<div class="driver-summary"><div>${icon("shield")}<span>${esc(driver.site_name || driver.union_name)}<small>${esc(driver.union_name || "Sitio autorizado")}</small></span></div><div>${icon("car")}<span>${esc(driver.vehicle)}<small>${esc(driver.plate)} · ${esc(driver.vehicle_color)}</small></span></div><div>${icon("star")}<span>${Number(driver.rating).toFixed(1)}<small>${driver.completed_trips} viajes completos</small></span></div></div>${occupied ? `<aside class="driver-capacity-card ${seats === 1 ? "driver-capacity-last" : ""}">${icon("users", 19)}<div><strong>${seats === 0 ? "Unidad completa" : seats === 1 ? "Solo puedes subir a 1 persona más" : `Puedes subir a ${seats} personas más`}</strong><span>${occupied} de 4 lugares ocupados; todos los menores cuentan.</span></div></aside>` : ""}`;
    const pending = data.rides.filter((ride) => ride.status === "requested" && ride.site_id === driver.site_id &&
      (driver.status === "available" || ride.share_requested_driver_id === driver.id));
    const cards = pending.map((ride) => `<article class="available-request-card"><div>${rideStatus(ride.status)}<strong>${esc(ride.pickup_label)} → ${esc(ride.destination_label)}</strong>${ride.scheduled_at ? `<small class="scheduled-ride-label">${icon("clock", 14)} ${esc(scheduleLabel(ride.scheduled_at))}</small>` : ""}${ride.shared_service ? `<small class="shared-ride-label">${icon("users", 14)} Lugar compartido · ${seats} ${seats === 1 ? "lugar disponible" : "lugares disponibles"}</small>` : ""}<span>${ride.passengers} persona${ride.passengers === 1 ? "" : "s"} · ${ride.price_requires_confirmation ? "Tarifa pendiente de validación" : money(ride.estimated_fare)} · efectivo</span></div><label><span>¿En cuántos minutos puedes recogerle?</span><input type="number" min="1" max="180" value="${ride.eta_minutes || 12}" data-claim-eta="${esc(ride.id)}"></label><div class="request-claim-actions"><button class="primary-button" data-action="claim-ride" data-id="${esc(ride.id)}" ${ride.price_requires_confirmation || ride.passengers > seats ? "disabled" : ""}>${icon("check", 16)} Tomar solicitud</button><button class="secondary-button" data-action="claim-passing" data-id="${esc(ride.id)}" ${ride.price_requires_confirmation || ride.passengers > seats ? "disabled" : ""}>Voy de paso</button></div></article>`).join("");
    let services;

    if (current) {
      const heading = current.status === "accepted" ? "Ve al punto de partida" : current.status === "arrived" ? "Solicita el código al pasajero" : "Lleva al pasajero a su destino";
      const submit = current.status === "accepted" ? "Ya llegué por el pasajero" : current.status === "arrived" ? "Verificar código e iniciar viaje" : "Finalizar viaje";
      const code = current.status === "arrived" ? '<label class="form-field"><span>Código de seguridad</span><input class="security-code-input" id="ride-security-code" inputmode="numeric" maxlength="4" placeholder="0000"><small>El pasajero puede verlo en su pantalla.</small></label>' : "";
      const selector = activeRides.length > 1 ? `<div class="active-passenger-selector"><strong>Servicios activos en esta unidad</strong>${activeRides.map((ride) => `<button class="${ride.id === current.id ? "active-passenger-selected" : ""}" data-action="select-active-ride" data-id="${esc(ride.id)}">${esc(ride.passenger_name)} · ${ride.passengers} lugar(es)</button>`).join("")}</div>` : "";
      services = `${selector}<div class="driver-active-layout"><div class="driver-active-card">${rideStatus(current.status)}<h2>${esc(heading)}</h2>${current.scheduled_at ? `<div class="scheduled-ride-label">${icon("clock", 15)} ${esc(scheduleLabel(current.scheduled_at))}</div>` : ""}${routePreview(current.pickup_label, current.destination_label)}${current.arrival_point ? `<p class="arrival-note">Entrega: ${esc(current.arrival_point)}</p>` : ""}<div class="assigned-driver">${photo(current.passenger_photo_url, current.passenger_name, "driver-portrait")}<div><strong>${esc(current.passenger_name)}</strong><span>${current.passengers} pasajero${current.passengers === 1 ? "" : "s"}${current.child_passengers ? ` · ${current.child_passengers} menor(es)` : ""}</span>${current.notes ? `<small>${esc(current.notes)}</small>` : ""}</div>${current.passenger_phone ? `<a class="round-contact" href="tel:${esc(String(current.passenger_phone).replace(/[^\d+]/g, ""))}">${icon("phone")}</a>` : ""}</div>${current.pickup_photo_url ? `<figure class="pickup-photo-preview"><img src="${esc(current.pickup_photo_url)}" alt="Fachada del lugar donde se encuentra el pasajero"><figcaption>Fachada o referencia compartida por el pasajero</figcaption></figure>` : ""}${code}<div class="fare-summary"><span>Cobrar únicamente en efectivo</span><strong>${money(current.estimated_fare)}</strong></div><button class="primary-button action-wide" data-action="advance-ride" data-id="${esc(current.id)}"><span>${esc(submit)}</span>${icon("arrow")}</button>${current.status !== "in_progress" ? `<button class="text-danger-button" data-action="cancel-ride" data-id="${esc(current.id)}">Cancelar servicio</button>` : ""}</div><div class="map-host taxi-map" data-map="ride" data-id="${esc(current.id)}"></div></div>${cards ? `<div class="subsection-heading"><div><h2>Personas que solicitan un lugar en tu ruta</h2><p>Solo puedes aceptar solicitudes que respeten los ${seats} ${seats === 1 ? "lugar disponible" : "lugares disponibles"}.</p></div></div><div class="available-request-list">${cards}</div>` : ""}`;
    } else {
      services = `<div class="subsection-heading"><div><h2>Solicitudes disponibles de tu sitio</h2><p>${driver.status === "available" ? "Toma una solicitud si estás libre o pasarás por la zona; tu sitio verá la asignación." : "Marca tu unidad como disponible para revisar solicitudes."}</p></div></div>${cards ? `<div class="available-request-list">${cards}</div>` : empty("bell", driver.status === "available" ? "Sin solicitudes pendientes" : "Tu unidad está desconectada", driver.status === "available" ? "Cuando alguien solicite recogida fuera de tu sitio podrás tomar el servicio desde aquí." : "Activa tu disponibilidad cuando estés listo y con documentación vigente.")}`;
    }
    const schedule = `<form class="driver-schedule-card" data-form="driver-schedule"><input type="hidden" name="driverId" value="${esc(driver.id)}"><div><strong>Mi horario personal de trabajo</strong><span>Independiente del horario administrativo de tu sitio.</span></div><label>Inicio<input type="time" name="shiftStart" value="${esc(driver.shift_start || "06:00")}"></label><label>Fin<input type="time" name="shiftEnd" value="${esc(driver.shift_end || "22:00")}"></label><button class="secondary-button" type="submit">Guardar horario</button></form>`;
    return `<section class="content-section">${section(`UNIDAD ${driver.unit_number}`, `Hola, ${driver.name.split(" ")[0]}`, "Toma solicitudes de tu sitio cuando estés libre o de paso; todas las asignaciones quedan auditadas.", button)}${picker}${summary}${!preview ? schedule : ""}${services}</section>`;
  }

  function settings() {
    const configuration = state.data.settings;
    const toggle = (name, title, detail, checked) => `<label class="compliance-toggle"><span><strong>${esc(title)}</strong><small>${esc(detail)}</small></span><input type="checkbox" name="${name}" ${checked ? "checked" : ""}></label>`;
    const pricing = `<div class="settings-block"><div class="settings-block-title">${icon("banknote")}<div><h2>Tarifas, descuentos y salidas especiales</h2><p>Solo efectivo. Registra importes y descuentos realmente autorizados.</p></div></div><div class="form-grid"><label class="form-field"><span>Cargo general de recogida</span><input name="pickupFee" type="number" min="0" required value="${esc(configuration.pickup_fee)}"></label><label class="form-field"><span>Tope especial por persona</span><input name="specialMaxPerPerson" type="number" min="1" required value="${esc(configuration.special_max_per_person)}"></label><label class="form-field"><span>Descuento adulto mayor</span><input name="seniorDiscount" type="number" min="0" value="${esc(configuration.senior_discount)}"></label><label class="form-field"><span>Descuento estudiante general</span><input name="studentDiscount" type="number" min="0" value="${esc(configuration.student_discount)}"></label><label class="form-field"><span>Edad máxima con exención infantil</span><input name="childFreeMaxAge" type="number" min="0" max="9" value="${esc(configuration.child_free_max_age)}"><small>Sin autorización expresa, el límite permanece en dos años.</small></label><label class="form-field"><span>Tiempo sugerido de recogida</span><input name="defaultEtaMinutes" type="number" min="1" max="120" value="${esc(configuration.default_eta_minutes)}"></label></div><div class="compliance-switches">${toggle("discountsAuthorized", "Descuentos autorizados por la autoridad competente", "Actívalo solo cuando los descuentos de adulto mayor y estudiante sean legalmente aplicables.", configuration.discounts_authorized)}${toggle("childFareAuthorized", "Tengo autorización expresa para una exención infantil mayor", "No elimina la obligación de asiento, cinturón o sistema de retención; nunca permite menores en las piernas.", configuration.child_fare_authorized)}</div></div>`;
    const operation = `<div class="settings-block"><div class="settings-block-title">${icon("clock")}<div><h2>Horarios, recogida y control de sitios</h2><p>Los taxistas conservan su horario personal; la administración define el horario de despacho de las bases.</p></div></div><div class="form-grid"><label class="form-field"><span>Inicio general de control de sitios</span><input name="siteDispatchStart" type="time" value="${esc(configuration.site_dispatch_start)}"></label><label class="form-field"><span>Fin general de control de sitios</span><input name="siteDispatchEnd" type="time" value="${esc(configuration.site_dispatch_end)}"></label><label class="form-field"><span>Radio excluido alrededor de la base, metros</span><input name="siteExclusionMeters" type="number" min="20" max="500" value="${esc(configuration.site_exclusion_meters)}"><small>Requiere coordenadas de la base configuradas.</small></label><label class="form-field"><span>Zona atendida</span><input name="serviceArea" value="${esc(configuration.service_area)}"></label><label class="form-field"><span>Teléfono de soporte</span><input name="supportPhone" value="${esc(configuration.support_phone)}"></label><label class="form-field"><span>Contacto de incidentes</span><input name="incidentPhone" value="${esc(configuration.incident_phone)}"></label></div><div class="compliance-switches">${toggle("allowDriverClaim", "Permitir que taxistas tomen solicitudes de su sitio", "También pueden indicar que van de paso; cada aceptación queda auditada.", configuration.allow_driver_claim)}</div></div>`;
    const privacy = `<div class="settings-block"><div class="settings-block-title">${icon("shield")}<div><h2>Responsable legal y privacidad</h2><p>Estos datos aparecen automáticamente en todos los documentos legales.</p></div></div><div class="form-grid"><label class="form-field"><span>Nombre o razón social responsable</span><input name="responsibleName" value="${esc(configuration.responsible_name)}"></label><label class="form-field"><span>Correo para derechos ARCO</span><input name="privacyEmail" type="email" value="${esc(configuration.privacy_email)}"></label><label class="form-field"><span>Domicilio legal completo</span><input name="responsibleAddress" value="${esc(configuration.responsible_address)}"></label><label class="form-field"><span>Conservación de datos, días</span><input name="retentionDays" type="number" min="30" max="1825" required value="${esc(configuration.data_retention_days)}"></label></div><div class="compliance-switches">${toggle("pilotMode", "Mantener modo piloto interno", "No operar públicamente mientras falten autorizaciones o revisión jurídica.", configuration.pilot_mode)}${toggle("insuranceRequired", "Exigir seguro vigente a cada taxi", "Bloquea unidades sin póliza de responsabilidad civil válida.", configuration.insurance_required)}${toggle("legalReviewConfirmed", "Documentación revisada por abogado", "Confirmo revisión de privacidad, términos, contratos y obligaciones de transporte.", configuration.legal_review_confirmed)}${toggle("transportAuthorizationConfirmed", "Requisitos verificados con la autoridad de transporte", "Confirma concesiones, tarifas, descuentos y registro de plataforma cuando corresponda.", configuration.transport_authorization_confirmed)}</div><p class="legal-settings-note">Ningún documento elimina derechos obligatorios ni responsabilidad por dolo, negligencia o incumplimientos.</p><button class="secondary-button retention-button" data-action="purge-history" type="button">${icon("shield", 15)} Depurar servicios fuera del plazo${configuration.last_purge_at ? ` · ${esc(when(configuration.last_purge_at))}` : ""}</button></div>`;
    return `<section class="content-section">${section("CONTROL, TRAZABILIDAD Y CUMPLIMIENTO", "Configuración maestra", "Administra horarios, cargos, descuentos, seguridad, privacidad y operación de todos los sitios.")}<form class="settings-form" data-form="settings">${pricing}${operation}${privacy}<div class="settings-block service-toggle-card"><div><strong>Recepción de solicitudes</strong><p>${configuration.service_enabled ? "Los pasajeros pueden pedir taxis." : "Las solicitudes nuevas están detenidas."}</p></div><label class="switch-checkbox"><input type="checkbox" name="serviceEnabled" ${configuration.service_enabled ? "checked" : ""}><span></span></label></div><button class="primary-button settings-save" type="submit">${icon("check")}<span>Guardar configuración maestra</span></button></form></section>`;
  }

  function rideConfirmationModal() {
    const draft = state.draft;
    const site = state.data.sites.find((item) => item.id === draft.siteId);
    const quote = calculateQuote();
    const destination = quote?.tariff?.destination || draft.specialDestination;
    const shared = sharedOpportunity();
    const scheduled = draft.scheduleMode === "scheduled";
    const appointment = scheduled ? new Date(draft.scheduledAt) : null;
    if (scheduled && (!appointment || !Number.isFinite(appointment.getTime()) || appointment.getTime() < Date.now() + 2 * 60_000)) {
      return toast("Selecciona una fecha y hora futuras con al menos dos minutos de anticipación.", true);
    }
    state.modal = { type: "ride-confirmation" };
    const summary = `<div class="ride-confirmation-summary"><div><span>Sitio responsable</span><strong>${esc(site?.name || "")}</strong></div><div><span>Punto A · recogida</span><strong>${esc(draft.pickup.label)}</strong></div><div><span>Punto B · destino</span><strong>${esc(destination)}</strong></div><div><span>Personas adultas</span><strong>${draft.passengers}</strong></div><div><span>Menores que también ocupan lugar</span><strong>${draft.children}</strong></div><div><span>Total de lugares solicitados</span><strong>${draft.passengers + draft.children}${shared ? ` de ${shared.available_seats} disponibles` : ""}</strong></div><div><span>Hora de recogida</span><strong>${esc(scheduled ? scheduleLabel(appointment.toISOString()) : "Lo antes posible")}</strong></div><div><span>Pago</span><strong>Únicamente efectivo</strong></div><div><span>${quote?.pending ? "Precio de salida especial" : "Importe estimado"}</span><strong>${quote?.pending ? "Se mostrará cuando el sitio valide el punto B" : money(quote?.fare)}</strong></div></div>${shared ? '<p class="confirmation-note">Estás pidiendo un lugar en una unidad que ya lleva otras personas; el conductor debe confirmar que pasa por tu zona.</p>' : ""}<div class="confirmation-actions"><button class="secondary-button" type="button" data-action="close-modal">Corregir datos</button><button class="primary-button" type="button" data-action="confirm-ride-request"><span>Confirmar solicitud</span>${icon("check", 17)}</button></div>`;
