  class InteractiveMap {
    constructor(host, options) {
      this.host = host;
      this.options = options;
      this.zoom = 15;
      this.center = options.pickup || options.destination || CENTER;
      this.gesture = null;
      this.resizeObserver = null;
      this.fit();
      this.host.innerHTML = '<div class="map-canvas" role="application" aria-label="Mapa interactivo de Turicato"></div><div class="map-zoom-control"><button data-map-zoom="in" aria-label="Acercar">+</button><button data-map-zoom="out" aria-label="Alejar">−</button></div>' + (options.interactive ? `<div class="map-selection-hint"><span class="${state.draft.selecting === "pickup" ? "hint-dot-green" : "hint-dot-orange"}"></span>Toca el mapa para marcar ${state.draft.selecting === "pickup" ? "la partida" : "el destino"}</div>` : "") + '<a class="map-attribution" target="_blank" rel="noreferrer" href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a>';
      this.canvas = this.host.querySelector(".map-canvas");
      this.bind();
      if (typeof ResizeObserver !== "undefined") {
        this.resizeObserver = new ResizeObserver(() => this.draw());
        this.resizeObserver.observe(this.host);
      }
      this.draw();
    }

    world(point, zoom = this.zoom) {
      const scale = 256 * 2 ** zoom;
      const latitude = Math.max(-85.0511, Math.min(85.0511, point.lat));
      const sine = Math.sin(latitude * Math.PI / 180);
      return { x: (point.lng + 180) / 360 * scale, y: (.5 - Math.log((1 + sine) / (1 - sine)) / (4 * Math.PI)) * scale };
    }

    coordinate(point) {
      const scale = 256 * 2 ** this.zoom;
      const latitude = Math.PI - 2 * Math.PI * point.y / scale;
      return { lat: 180 / Math.PI * Math.atan(.5 * (Math.exp(latitude) - Math.exp(-latitude))), lng: point.x / scale * 360 - 180 };
    }

    fit() {
      const pickup = this.options.pickup;
      const destination = this.options.destination;
      if (!pickup || !destination) return;
      this.center = { lat: (pickup.lat + destination.lat) / 2, lng: (pickup.lng + destination.lng) / 2 };
      const difference = Math.max(Math.abs(pickup.lat - destination.lat), Math.abs(pickup.lng - destination.lng));
      this.zoom = difference > .08 ? 11 : difference > .035 ? 12 : difference > .014 ? 13 : difference > .006 ? 14 : 15;
    }

    bind() {
      this.canvas.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        this.canvas.setPointerCapture(event.pointerId);
        this.gesture = { x: event.clientX, y: event.clientY, center: { ...this.center }, moved: false };
      });
      this.canvas.addEventListener("pointermove", (event) => {
        if (!this.gesture) return;
        const dx = event.clientX - this.gesture.x;
        const dy = event.clientY - this.gesture.y;
        if (Math.abs(dx) + Math.abs(dy) > 7) this.gesture.moved = true;
        if (this.gesture.moved) {
          const origin = this.world(this.gesture.center);
          this.center = this.coordinate({ x: origin.x - dx, y: origin.y - dy });
          this.draw();
        }
      });
      this.canvas.addEventListener("pointerup", (event) => {
        const gesture = this.gesture;
        this.gesture = null;
        if (!gesture?.moved && this.options.interactive) {
          const box = this.host.getBoundingClientRect();
          const center = this.world(this.center);
          const location = this.coordinate({ x: center.x + event.clientX - box.left - box.width / 2, y: center.y + event.clientY - box.top - box.height / 2 });
          chooseMapPoint(location);
        }
      });
      this.canvas.addEventListener("pointercancel", () => { this.gesture = null; });
      this.host.querySelectorAll("[data-map-zoom]").forEach((button) => button.addEventListener("click", () => {
        this.zoom = Math.max(9, Math.min(18, this.zoom + (button.dataset.mapZoom === "in" ? 1 : -1)));
        this.draw();
      }));
    }

    draw() {
      if (!this.canvas || !this.host.isConnected) return;
      const width = this.host.clientWidth || 360;
      const height = this.host.clientHeight || 300;
      const center = this.world(this.center);
      const startX = Math.floor((center.x - width / 2) / 256);
      const endX = Math.floor((center.x + width / 2) / 256);
      const startY = Math.floor((center.y - height / 2) / 256);
      const endY = Math.floor((center.y + height / 2) / 256);
      const scale = 2 ** this.zoom;
      let tiles = "";

      for (let x = startX; x <= endX; x++) {
        for (let y = startY; y <= endY; y++) {
          if (y < 0 || y >= scale) continue;
          const tileX = ((x % scale) + scale) % scale;
          const left = x * 256 - center.x + width / 2;
          const top = y * 256 - center.y + height / 2;
          tiles += `<span class="map-tile" aria-hidden="true" style="left:${left}px;top:${top}px;background-image:url(https://tile.openstreetmap.org/${this.zoom}/${tileX}/${y}.png)"></span>`;
        }
      }

      const point = (coordinates) => {
        if (!coordinates) return null;
        const position = this.world(coordinates);
        return { x: position.x - center.x + width / 2, y: position.y - center.y + height / 2 };
      };
      const first = point(this.options.pickup);
      const second = point(this.options.destination);
      if (first && second) {
        tiles += `<svg class="route-overlay" aria-hidden="true" viewBox="0 0 ${width} ${height}"><path d="M ${first.x} ${first.y} C ${first.x + (second.x - first.x) * .33} ${first.y - 22}, ${second.x - (second.x - first.x) * .26} ${second.y + 22}, ${second.x} ${second.y}" fill="none" stroke="#134738" stroke-dasharray="8 7" stroke-linecap="round" stroke-width="3.5"></path></svg>`;
      }
      if (first) tiles += `<span class="map-pin map-pin-pickup" style="left:${first.x}px;top:${first.y}px"><span>A</span></span>`;
      if (second) tiles += `<span class="map-pin map-pin-destination" style="left:${second.x}px;top:${second.y}px"><span>B</span></span>`;
      this.canvas.innerHTML = tiles;
    }

    destroy() {
      if (this.resizeObserver) this.resizeObserver.disconnect();
      this.resizeObserver = null;
    }
  }

  function prepareMaps() {
    const host = app.querySelector(".map-host");
    if (!host) return;
    const kind = host.dataset.map;
    if (kind === "request") {
      state.map = new InteractiveMap(host, { pickup: state.draft.pickup, destination: state.draft.destination, interactive: true });
    } else if (kind === "ride") {
      const ride = state.data.rides.find((item) => item.id === host.dataset.id);
      if (ride) state.map = new InteractiveMap(host, { pickup: { lat: ride.pickup_lat, lng: ride.pickup_lng }, destination: { lat: ride.destination_lat, lng: ride.destination_lng } });
    } else {
      const ride = state.data.rides.find((item) => ACTIVE.includes(item.status));
      state.map = new InteractiveMap(host, { pickup: ride ? { lat: ride.pickup_lat, lng: ride.pickup_lng } : CENTER, destination: ride ? { lat: ride.destination_lat, lng: ride.destination_lng } : null });
    }
  }

  function chooseMapPoint(coordinates) {
    const label = `Punto marcado · ${coordinates.lat.toFixed(4)}, ${coordinates.lng.toFixed(4)}`;
    if (state.draft.selecting === "pickup") {
      state.draft.pickup = { ...coordinates, label };
      state.draft.selecting = "destination";
    } else {
      state.draft.destination = { ...coordinates, label };
    }
    render();
  }

  async function submitForm(form) {
    const values = Object.fromEntries(new FormData(form));
    switch (form.dataset.form) {
      case "login": {
        const result = await request("login", values, { message: "Inicio de sesión correcto." });
        if (result?.account && state.gate === "driver" && result.account.role !== "driver") toast("Iniciaste con una cuenta que no está registrada como taxista.", true);
        break;
      }
      case "register": await request("registerPassenger", values, { message: "Tu cuenta de pasajero está lista." }); break;
      case "organization": await request("createOrganization", values, { closeModal: true, message: `${values.kind === "union" ? "Sindicato" : "Grupo"} registrado correctamente.` }); break;
      case "driver": await request("createDriver", values, { closeModal: true, message: "Taxista y unidad autorizados correctamente." }); break;
      case "reset-password": await request("resetDriverPassword", values, { closeModal: true, message: "La contraseña del taxista se actualizó." }); break;
      case "change-password": await request("changePassword", values, { closeModal: true, message: "Tu contraseña se actualizó." }); break;
      case "profile": await request("saveProfile", values, { message: "Tu perfil se actualizó." }); break;
      case "settings": await request("saveSettings", { ...values, serviceEnabled: form.elements.serviceEnabled.checked }, { message: "Se actualizó la configuración del servicio." }); break;
      default: break;
    }
  }

  function buttonAction(button, event) {
    const action = button.dataset.action;
    if (!action) return;

    if (action === "choose-gate") { state.gate = button.dataset.value; render(); return; }
    if (action === "auth-register") { state.authMode = "register"; state.gate = "passenger"; render(); return; }
    if (action === "auth-login") { state.authMode = "login"; render(); return; }
    if (action === "navigate") { state.page = button.dataset.page; state.sidebar = false; state.rideFilter = "all"; render(); return; }
    if (action === "open-sidebar") { state.sidebar = true; render(); return; }
    if (action === "close-sidebar") { state.sidebar = false; render(); return; }
    if (action === "close-toast") { notifications.innerHTML = ""; return; }
    if (action === "logout") { void request("logout"); return; }
    if (action === "close-modal") { closeModal(); return; }
    if (action === "modal-backdrop" && event.target === button) { closeModal(); return; }
    if (action === "open-union-modal") { organizationModal("union"); return; }
    if (action === "open-group-modal") { organizationModal("group"); return; }
    if (action === "open-driver-modal") { driverModal(); return; }
    if (action === "open-reset-password") { resetPasswordModal(button.dataset.id); return; }
    if (action === "open-change-password") { changePasswordModal(); return; }

    if (action === "choose-color") {
      const color = button.dataset.value;
      if (!COLORS.includes(color)) return;
      dialogs.querySelector('[name="color"]').value = color;
      dialogs.querySelectorAll(".color-options button").forEach((item) => item.classList.toggle("color-active", item.dataset.value === color));
      return;
    }

    if (action === "toggle-organization") { void request("toggleOrganization", { id: button.dataset.id }, { message: "Se actualizó la organización." }); return; }
    if (action === "toggle-driver") { void request("toggleDriver", { id: button.dataset.id }, { message: "Se actualizó el estado del taxista." }); return; }
    if (action === "ride-filter") { state.rideFilter = button.dataset.value; render(); return; }
    if (action === "select-pickup") { if (event.target.closest("input,button")) return; state.draft.selecting = "pickup"; render(); return; }
    if (action === "select-destination") { if (event.target.closest("input,button")) return; state.draft.selecting = "destination"; render(); return; }

    if (action === "locate-me") {
      event.stopPropagation();
      if (!navigator.geolocation) return toast("Este dispositivo no admite geolocalización.", true);
      navigator.geolocation.getCurrentPosition((position) => {
        state.draft.pickup = { lat: position.coords.latitude, lng: position.coords.longitude, label: "Mi ubicación actual" };
        state.draft.selecting = "destination";
        render();
      }, () => toast("No fue posible obtener tu ubicación. Revisa los permisos del navegador.", true), { enableHighAccuracy: true, timeout: 12000 });
      return;
    }

    if (action === "choose-place") {
      const place = PLACES[Number(button.dataset.value)];
      if (!place) return;
      if (state.draft.selecting === "pickup") { state.draft.pickup = { ...place }; state.draft.selecting = "destination"; }
      else state.draft.destination = { ...place };
      render();
      return;
    }

    if (action === "passengers-minus") { state.draft.passengers = Math.max(1, state.draft.passengers - 1); render(); return; }
    if (action === "passengers-plus") { state.draft.passengers = Math.min(4, state.draft.passengers + 1); render(); return; }
    if (action === "choose-payment") { state.draft.payment = button.dataset.value === "transfer" ? "transfer" : "cash"; render(); return; }

    if (action === "request-ride") {
      const { pickup, destination, payment, passengers, notes } = state.draft;
      if (!destination) return toast("Primero marca el punto de destino.", true);
      void request("createRide", { pickupLabel: pickup.label, pickupLat: pickup.lat, pickupLng: pickup.lng, destinationLabel: destination.label, destinationLat: destination.lat, destinationLng: destination.lng, paymentMethod: payment, passengers, notes }, { message: "Tu solicitud se envió a los taxistas disponibles." });
      return;
    }

    if (action === "toggle-driver-status") {
      const driver = state.data.drivers.find((item) => item.id === button.dataset.id);
      if (!driver) return;
      const status = driver.status === "available" ? "offline" : "available";
      void request("setDriverStatus", { driverId: driver.id, status }, { message: status === "available" ? "La unidad ya puede recibir viajes." : "La unidad se desconectó." });
      return;
    }

    if (action === "accept-ride") { void request("acceptRide", { rideId: button.dataset.id, driverId: button.dataset.driver }, { message: "Aceptaste el servicio." }); return; }
    if (action === "assign-ride") {
      const select = button.closest(".manual-assignment")?.querySelector("select");
      if (select) void request("acceptRide", { rideId: button.dataset.id, driverId: select.value }, { message: "La unidad se asignó correctamente." });
      return;
    }
    if (action === "advance-ride") {
      const code = app.querySelector("#ride-security-code")?.value || "";
      void request("advanceRide", { rideId: button.dataset.id, securityCode: code }, { message: "Se actualizó el estado del servicio." });
      return;
    }
    if (action === "cancel-ride") {
      if (window.confirm("¿Deseas cancelar este servicio?")) void request("cancelRide", { rideId: button.dataset.id }, { message: "El viaje se canceló." });
      return;
    }
    if (action === "rate-ride") { void request("rateRide", { rideId: button.dataset.id, rating: Number(button.dataset.value) }, { message: "Gracias por calificar tu viaje." }); }
  }

  document.addEventListener("click", (event) => {
    const trigger = event.target.closest("[data-action]");
    if (trigger) buttonAction(trigger, event);
  });

  document.addEventListener("submit", (event) => {
    const form = event.target.closest("[data-form]");
    if (!form) return;
    event.preventDefault();
    void submitForm(form);
  });

  document.addEventListener("input", (event) => {
    const input = event.target;
    if (input.dataset.input === "pickup-label") state.draft.pickup.label = input.value;
    if (input.dataset.input === "destination-label") {
      if (!state.draft.destination) state.draft.destination = { ...CENTER, label: input.value };
      else state.draft.destination.label = input.value;
      const requestButton = app.querySelector('[data-action="request-ride"]');
      if (requestButton) requestButton.disabled = input.value.trim().length < 3 || !state.data.settings.service_enabled;
    }
    if (input.dataset.input === "ride-notes") state.draft.notes = input.value;
    if (input.dataset.input === "driver-search") state.driverSearch = input.value;
  });

  document.addEventListener("change", (event) => {
    const select = event.target;
    if (select.dataset.input === "driver-search") { render(); return; }
    if (select.dataset.change === "union-filter") { state.unionFilter = select.value; render(); return; }
    if (select.dataset.change === "preview-driver") { state.selectedDriver = select.value; render(); return; }
    if (select.dataset.change === "modal-union") {
      const options = state.data.groups.filter((group) => group.active && group.parent_id === select.value);
      dialogs.querySelector("#driver-group-select").innerHTML = '<option value="">Sin grupo asignado</option>' + options.map((group) => `<option value="${esc(group.id)}">${esc(group.name)}</option>`).join("");
    }
  });

  document.addEventListener("focusin", (event) => {
    if (event.target.dataset.input === "pickup-label") state.draft.selecting = "pickup";
    if (event.target.dataset.input === "destination-label") state.draft.selecting = "destination";
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && state.modal) closeModal();
  });

  setInterval(() => {
    if (!state.data || state.modal || state.pending || document.hidden) return;
    const focused = document.activeElement;
    if (focused && /INPUT|TEXTAREA|SELECT/.test(focused.tagName)) return;
    void refresh(true);
  }, 12000);

  void refresh();
})();
    </script>
  </body>
</html>
